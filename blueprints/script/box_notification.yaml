blueprint:
  name: ESP32-S3-BOX-3 notification
  description: >-
    Shows a full-screen notification on an ESP32-S3-BOX-3 running
    esphome-esp32-s3-box-3-va (base/screens/notify.yaml), and optionally says
    the same text on your speakers. Give it a fixed message, or a prompt and
    let a conversation agent write the message. Call the script from any
    automation with title, message or prompt, icon and seconds.
  domain: script
  author: Michal Zaniewicz
  source_url: https://github.com/MichalZaniewicz/esphome-esp32-s3-box-3-va/blob/main/blueprints/script/box_notification.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    box:
      name: Box
      icon: mdi:tablet
      input:
        box_name:
          name: ESPHome device name
          description: >-
            The Box's ESPHome name with dashes as underscores, the part between
            `esphome.` and `_show_notification` in Developer tools > Actions.
            For a Box called esp32-s3-box-3-0b7b2c it is esp32_s3_box_3_0b7b2c.
          selector:
            text: {}
    voice:
      name: Speakers (optional)
      icon: mdi:speaker
      collapsed: true
      input:
        speakers:
          name: Speakers
          description: Where to say the message as well. Leave empty to only show it.
          default: []
          selector:
            entity:
              domain: media_player
              multiple: true
        tts_entity:
          name: Text-to-speech
          default: ""
          selector:
            entity:
              domain: tts
        tts_voice:
          name: Voice
          description: Optional voice for the TTS engine, for example pl-PL-Chirp3-HD-Achernar.
          default: ""
          selector:
            text: {}
        announce_volume:
          name: Announcement volume
          description: Set the speakers to this volume for the message, then put them back. 0 leaves the volume alone.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        fallback_volume:
          name: Volume to restore when unknown
          description: >-
            A speaker group (Google Cast, for one) does not report its volume,
            so there is nothing to put back; it is set to this instead. 0 leaves
            such speakers at the announcement volume.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        restore_after:
          name: Restore volume after
          default: 15
          selector:
            number:
              min: 3
              max: 120
              unit_of_measurement: s
              mode: box
    writer:
      name: Message writer (optional)
      icon: mdi:robot
      collapsed: true
      input:
        agent:
          name: Conversation agent
          description: Used only when the call passes a prompt instead of a message.
          default: conversation.home_assistant
          selector:
            conversation_agent: {}

mode: queued
max: 10

fields:
  title:
    name: Title
    description: The big line on the screen.
    required: true
    example: Laundry is done
    selector:
      text: {}
  message:
    name: Message
    description: The smaller line under it, and what the speakers say. Leave empty when passing a prompt.
    example: Time to hang it up
    selector:
      text:
        multiline: true
  prompt:
    name: Prompt
    description: Ask the conversation agent to write the message instead, for example "Tell me in one short sentence that the dishwasher has finished."
    selector:
      text:
        multiline: true
  icon:
    name: Icon
    default: bell
    selector:
      select:
        options: [bell, washer, dryer, dishwasher, stove, food, timer, door, doorbell, package, phone,
                  car, cart, trash, vacuum, leak, rain, thermometer, light, info, alert, check]
  seconds:
    name: Seconds on screen
    description: 0 uses the Box's Notification time slider, -1 stays until someone taps it.
    default: -1
    selector:
      number:
        min: -1
        max: 600
        mode: box

variables:
  box_name: !input box_name
  speakers: !input speakers
  tts_entity: !input tts_entity
  tts_voice: !input tts_voice
  announce_volume: !input announce_volume
  fallback_volume: !input fallback_volume
  agent: !input agent
  # Declared here so the if/else below can set it for the steps after it: a
  # variables step only reaches an outer scope that already has the name.
  text: ""
  previous_volumes: >-
    {% set ns = namespace(d={}) %}
    {% for s in speakers %}{% set ns.d = dict(ns.d, **{s: state_attr(s, 'volume_level')}) %}{% endfor %}
    {{ ns.d }}

sequence:
  - if:
      - condition: template
        value_template: "{{ prompt | default('') | length > 0 }}"
    then:
      - action: conversation.process
        data:
          agent_id: "{{ agent }}"
          text: "{{ prompt }}"
        response_variable: written
      - variables:
          text: "{{ written.response.speech.plain.speech }}"
    else:
      - variables:
          text: "{{ message | default('') }}"

  - action: "esphome.{{ box_name }}_show_notification"
    data:
      title: "{{ title }}"
      message: "{{ text }}"
      icon: "{{ icon | default('bell') }}"
      seconds: "{{ seconds | default(-1) | int }}"
    continue_on_error: true
    note: An offline Box must not stop the spoken announcement.

  - if:
      - condition: template
        value_template: "{{ speakers | length > 0 and tts_entity != '' and text | length > 0 }}"
    then:
      - if:
          - condition: template
            value_template: "{{ announce_volume | float(0) > 0 }}"
        then:
          - action: media_player.volume_set
            target:
              entity_id: "{{ speakers }}"
            data:
              volume_level: "{{ announce_volume | float / 100 }}"
      - action: tts.speak
        target:
          entity_id: "{{ tts_entity }}"
        data:
          media_player_entity_id: "{{ speakers }}"
          message: "{{ text }}"
          options: "{{ {'voice': tts_voice} if tts_voice else {} }}"
      - if:
          - condition: template
            value_template: "{{ announce_volume | float(0) > 0 }}"
        then:
          - delay:
              seconds: !input restore_after
          - repeat:
              for_each: "{{ speakers }}"
              sequence:
                - variables:
                    back_to: >-
                      {% set v = previous_volumes.get(repeat.item) %}
                      {{ v if v is number else (fallback_volume | float(0) / 100) }}
                - if:
                    - condition: template
                      value_template: "{{ back_to | float(0) > 0 }}"
                  then:
                    - action: media_player.volume_set
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        volume_level: "{{ back_to }}"
                      continue_on_error: true
