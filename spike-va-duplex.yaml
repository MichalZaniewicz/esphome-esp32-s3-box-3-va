# =============================================================================
# SPIKE 2, gałąź `audio-stack`. A voice assistant on the duplex audio stack.
# -----------------------------------------------------------------------------
# Spike 1 answered the hardware question: this board carries the speaker DAC
# back into the ES7210, on TDM slot 1, and the component runs full duplex at
# 48 kHz with 16-bit slots. See SPIKE-FINDINGS.md.
#
# This one answers the only question left before any migration is worth
# planning: **does an assistant actually work on it, and does AEC buy barge-in?**
#
# Deliberately NOT a port of base/core.yaml. No display, no LVGL, no character,
# no carousel, no TTS routing, no timers - one microphone, one wake word, one
# pipeline, one speaker. Every one of those omissions is a variable this test
# does not have to control.
#
# WSZYSTKIE TRZY PYTANIA SPIKE'A MAJA JUZ ODPOWIEDZ, zmierzona 2026-07-27:
# rozmowa dziala, referencja echa siedzi na slocie 1, barge-in dziala. Zostala
# jedna rzecz przed migracja rdzenia: wykrywanie na strumieniu po AEC jest
# slabsze niz na surowym mikrofonie. Maksima wysokie, 0.85 do 0.98, ale srednia
# z trzech klatek 0.37 do 0.60 wobec 0.60 do 0.79 w kuchennym firmware. Szczyt
# jest krotki, nie sygnal slaby, i dzis stoi na oknie jednej klatki.
#
# DLATEGO TEN PLIK JEST TERAZ PRZYRZADEM POMIAROWYM. Trzy pokretla dzialaja na
# zywo, bez przebudowy, bo kazda kosztowala trzy minuty i wgranie:
#
#   Prog wykrywania   0.20 do 0.95   ile modelu trzeba, zeby uznac trafienie
#   Wzmocnienie mww   1 do 16        mnoznik PRZED modelem, z obcinaniem
#   Tryb AEC          trzy tryby     przekonfigurowanie kanceleru bez restartu
#
# I przelacznik `Tryb strojenia`, ktory odcina rozmowe: wybudzenie tylko sie
# liczy i wake word nie zatrzymuje sie po trafieniu. Bez tego seria dziesieciu
# "Alexa" mierzy pierwsze slowo i dziewiec razy cisze, bo pipeline trzyma
# mikrofon kilkanascie sekund.
#
# METODA: dziesiec razy "Alexa" z tego samego miejsca, co trzy sekundy. Trafienia
# licza sie same, na ekranie i w logu. Potem jedno pokretlo w bok i to samo raz
# jeszcze. Falszywe wybudzenia mierzy sie odwrotnie: okno ciszy i licznik.
# =============================================================================

substitutions:
  name: box3-va-duplex
  friendly_name: BOX3 VA duplex

  i2c_sda: GPIO8
  i2c_scl: GPIO18
  i2s_mclk: GPIO2
  i2s_bclk: GPIO17
  i2s_lrclk: GPIO45
  i2s_dout: GPIO15
  i2s_din: GPIO16
  amp_enable: GPIO46
  lcd_clk: GPIO7
  lcd_mosi: GPIO6
  lcd_cs: GPIO5
  lcd_dc: GPIO4
  lcd_reset: GPIO48
  lcd_backlight: GPIO47

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  - id: i2c_bus
    sda: ${i2c_sda}
    scl: ${i2c_scl}
    scan: true
    frequency: 400kHz

external_components:
  - source: github://n-IA-hane/esphome-audio-stack@v2026.7.0
    components: [esp_audio_stack, esp_aec, esp_afe]

switch:
  # The amplifier stays on for the whole spike: barge-in cannot be tested
  # against a speaker nobody can hear.
  - platform: gpio
    id: amp_on
    name: Amplifier
    pin: ${amp_enable}
    restore_mode: ALWAYS_ON
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    aec:
      name: AEC

  # STROJENIE. Wlaczone: wybudzenie tylko sie liczy, rozmowa nie startuje, a
  # wake word nie zatrzymuje sie po trafieniu - `stop_after_detection` jest
  # ustawiane w locie, bo w YAML jest tylko stale. Wylaczone: normalny asystent.
  - platform: template
    name: Tryb strojenia
    id: tuning_mode
    icon: "mdi:tune"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lambda: id(mww).set_stop_after_detection(false);
      - if:
          condition:
            not:
              micro_wake_word.is_running:
          then:
            - micro_wake_word.start:
    turn_off_action:
      - lambda: id(mww).set_stop_after_detection(true);

  # Mute stops the wake word outright. No phases and no screen to keep in step
  # here - that is the core's job, and this file is not the core.
  - platform: template
    name: Mute
    id: mic_mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - micro_wake_word.stop:
    turn_off_action:
      - micro_wake_word.start:

button:
  - platform: restart
    name: Restart

# PROBA 1 z listy: samo kasowanie echa, bez reszty front endu.
#
# Zmierzone na pelnym AFE: maksima 0.55 do 0.95, ale SREDNIE 0.35 do 0.59 przy
# progu 0.60 - model rozpoznaje slowo pewnie, tylko przez zbyt krotka chwile, a
# uśrednianie po trzech klatkach to rozwadnia. Na surowym mikrofonie tej samej
# plytki te same slowa daja srednie 0.60 do 0.79. Redukcja szumu i AGC sa
# najbardziej podejrzane o przerobienie dynamiki, wiec tu ich po prostu nie ma.
esp_aec:
  id: aec_processor
  sample_rate: 16000
  mode: sr_low_cost
  filter_length: 4

esp_audio_stack:
  id: audio_stack
  processor_id: aec_processor
  # All four measured in spike 1, and they only work together: 32 bits at 48 kHz
  # fails the I2S init, and a 16 kHz bus plays silence because the speaker is
  # still fed 48 kHz with no conversion.
  sample_rate: 48000
  output_sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 16

  i2s_mclk_pin: ${i2s_mclk}
  i2s_bclk_pin: ${i2s_bclk}
  i2s_lrclk_pin: ${i2s_lrclk}
  i2s_din_pin: ${i2s_din}
  i2s_dout_pin: ${i2s_dout}

  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slot: 0
  tdm_ref_slot: 1          # measured: the only slot that moves with the amplifier off
  tdm_tx_slot: 0

  codec:
    input:
      type: es7210
      address: 0x40
    output:
      type: es8311
      address: 0x18

# EKRAN, zeby wybudzenie dalo sie potwierdzic wzrokiem, a nie tylko logiem.
# Jedna strona, jeden wielki napis, kolor na faze. Zadnej postaci, zadnej
# karuzeli - to nadal jest spike, a nie port rdzenia.
spi:
  - id: spi_bus
    clk_pin: ${lcd_clk}
    mosi_pin: ${lcd_mosi}

display:
  - platform: mipi_spi
    id: s3_box_lcd
    model: S3BOX
    data_rate: 40MHz
    cs_pin: ${lcd_cs}
    dc_pin: ${lcd_dc}
    reset_pin:
      number: ${lcd_reset}
      inverted: true
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false

output:
  - platform: ledc
    pin: ${lcd_backlight}
    id: backlight_output

light:
  - platform: monochromatic
    id: backlight
    name: Screen
    output: backlight_output
    restore_mode: ALWAYS_ON

font:
  - id: font_big
    file:
      type: gfonts
      family: Figtree
      weight: 700
    size: 44
    glyphs: "ABCDEFGHIJKLMNOPRSTUWYZ .!?"
  - id: font_small
    file:
      type: gfonts
      family: Figtree
      weight: 400
    size: 18
    glyphs: "abcdefghijklmnoprstuwyzABCDEFGHIJKLMNOPRSTUWYZ .,:!?0123456789"

lvgl:
  displays: [s3_box_lcd]
  pages:
    - id: page_main
      bg_color: 0x000000
      widgets:
        - label:
            id: lbl_phase
            align: CENTER
            y: -20
            text: "NASLUCH"
            text_font: font_big
            text_color: 0x2FA8E0
        - label:
            id: lbl_info
            align: CENTER
            y: 40
            text: "powiedz Alexa"
            text_font: font_small
            text_color: 0x8FA6C0

globals:
  # Licznik od startu urzadzenia. W trybie strojenia to jedyna rzecz, ktora
  # Michal widzi z drugiego konca kuchni: czy slowo w ogole trafilo.
  - id: detect_count
    type: int
    restore_value: false
    initial_value: '0'

script:
  - id: show
    mode: restart
    parameters:
      big: string
      small: string
      col: int
    then:
      - lambda: |-
          lv_label_set_text(id(lbl_phase), big.c_str());
          lv_label_set_text(id(lbl_info), small.c_str());
          lv_obj_set_style_text_color(id(lbl_phase), lv_color_hex(col), LV_PART_MAIN);

  # Mrugniecie na czas strojenia: pipeline nie startuje, wiec nic nie odeslaloby
  # ekranu do nasluchu. `restart`, bo przy niskim progu wybudzenia potrafia isc
  # jedno po drugim.
  - id: blip
    mode: restart
    then:
      - script.execute:
          id: show
          big: "ALEXA!"
          small: !lambda 'return "wybudzen: " + to_string(id(detect_count));'
          col: 0x35D07F
      - delay: 1200ms
      - script.execute:
          id: show
          big: "NASLUCH"
          small: !lambda 'return "wybudzen: " + to_string(id(detect_count));'
          col: 0x2FA8E0

# Kept from spike 1 so the reference can be re-checked without another build.
sensor:
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    tdm_slot_levels:
      - slot: 0
        name: TDM slot 0
      - slot: 1
        name: TDM slot 1
      - slot: 2
        name: TDM slot 2
      - slot: 3
        name: TDM slot 3

# Pokretla na zywo. mic_gain wchodzi PRZED procesorem, wiec dotyczy tego, co
# widzi wake word - i o to chodzi w tym stroju.
number:
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    mic_gain:
      name: Mic gain
      min_value: -20
      max_value: 30
    master_volume:
      name: Master volume

  # PROG WYKRYWANIA NA ZYWO. `set_probability_cutoff` jest publiczne na modelu, a
  # `get_wake_words()` na komponencie, wiec caly sweep progu robi sie bez jednej
  # przebudowy. Wczesniej kazdy krok kosztowal kompilacje i wgranie.
  #
  # `restore_value: false` i `initial_value` rowne temu, co jest wkompilowane:
  # po restarcie urzadzenie ma wrocic do stanu z pliku, a nie do przypadkowej
  # wartosci z flasha, ktora sfalszowalaby nastepny pomiar.
  - platform: template
    name: Prog wykrywania
    id: mww_cutoff
    icon: "mdi:target-variant"
    optimistic: true
    restore_value: false
    initial_value: 0.60
    min_value: 0.20
    max_value: 0.95
    step: 0.01
    mode: box
    entity_category: config
    set_action:
      - lambda: |-
          uint8_t q = (uint8_t) lroundf(x * 255.0f);
          for (auto *m : id(mww).get_wake_words()) {
            m->set_probability_cutoff(q);
          }
          ESP_LOGI("stroj", "prog wykrywania = %.2f (%u/255)", x, q);

  # WZMOCNIENIE PRZED MODELEM, tez na zywo. Mnozenie jest twarde i z obcinaniem
  # (clamp do Q25), wiec jesli wyjscie AEC jest juz glosne, x4 obcina szczyty i
  # deformuje widmo - a to wyglada dokladnie tak jak objaw, ktory tu tropimy.
  # Rdzen na surowym mikrofonie mial to obojetne, ale tam sygnal jest cichszy.
  - platform: template
    name: Wzmocnienie mww
    id: mww_gain
    icon: "mdi:volume-plus"
    optimistic: true
    restore_value: false
    initial_value: 4
    min_value: 1
    max_value: 16
    step: 1
    mode: box
    entity_category: config
    set_action:
      - lambda: |-
          id(mww_mic_src).set_gain_factor((int32_t) lroundf(x));
          ESP_LOGI("stroj", "wzmocnienie mww = %d", (int) lroundf(x));

# TRYB AEC NA ZYWO. Komponent umie sie przekonfigurowac bez restartu, wiec
# porownanie trybow to trzy klikniecia zamiast trzech przebudowy.
#
#   sr_low_cost   - liniowy AEC pod wake word, to jest obecny i domyslny
#   sr_high_perf  - ten sam typ, wiecej obliczen; potrzebuje 40 KB ciaglej
#                   pamieci DMA na 4 zaczepy i sam odmawia, gdy jej nie ma
#   fd_low_cost   - full duplex z tlumieniem nieliniowym (esp-sr 2.4+)
#
# Bez `restore_value`, z opcja startowa rowna wkompilowanej: po restarcie stan
# ma byc ten z pliku.
select:
  - platform: template
    name: Tryb AEC
    id: aec_mode
    icon: "mdi:tune-variant"
    optimistic: true
    restore_value: false
    initial_option: sr_low_cost
    entity_category: config
    options:
      - sr_low_cost
      - sr_high_perf
      - fd_low_cost
    on_value:
      - esp_aec.set_mode:
          id: aec_processor
          mode: !lambda return x;

microphone:
  - platform: esp_audio_stack
    id: clean_mic
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: speaker_out
    esp_audio_stack_id: audio_stack
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 500ms

media_player:
  - platform: speaker
    id: box_player
    name: Box player
    announcement_pipeline:
      speaker: speaker_out
      format: FLAC
      sample_rate: 48000
      num_channels: 1

# THE POINT OF THE WHOLE FILE: the wake word runs on the PROCESSED microphone,
# the one the AEC has already had its way with. On the current firmware it runs
# on the raw stream and is stopped outright whenever the speaker plays.
# STROJENIE, NIE PRODUKCJA. Prog zbity do 0.35 celowo: micro_wake_word nie
# loguje NICZEGO dla proby ponizej progu, wiec przy 0.6 "nie wykrywa" jest
# nieodroznialne od "nie slyszy". Nizszy prog zamienia to w liczby.
#
# gain_factor zostaje na 4 jak w rdzeniu, ale tam karmi surowy strumien, a tu
# wyjscie AFE - dlatego prawdziwym pokretlem jest `mic_gain` nizej, ustawialne
# na zywo bez przebudowy.
micro_wake_word:
  id: mww
  microphone:
    # Nazwany, zeby `gain_factor` dalo sie przestawiac w locie z lambdy. To jest
    # jedyny sposob, bo MicroWakeWord nie oddaje swojego zrodla mikrofonu.
    id: mww_mic_src
    microphone: clean_mic
    channels: 0
    gain_factor: 4
  models:
    - model: alexa
      # PROBA 2 z listy. Zmierzone na tym stosie, dwa razy, przy dwoch roznych
      # procesorach: maksima 0.85 do 0.98, srednie z trzech klatek 0.37 do 0.60.
      # Szczyt jest krotki i sasiednie klatki go rozwadniaja, wiec usrednianie po
      # trzech pracuje przeciwko nam. Okno 1 porownuje z progiem to, co model
      # naprawde widzi w najlepszej klatce.
      #
      # To nie jest obejscie: dokladnie tak naprawiono wykrywanie w rdzeniu, gdzie
      # skrocenie okna bylo tym, co zadzialalo. Cena jest znana - krotsze okno to
      # wieksza podatnosc na falszywe wybudzenia - i dlatego prog wraca na 0.6.
      probability_cutoff: 0.6
      sliding_window_size: 1
  # BEZ TEGO DETEKCJA PADA W PROZNIE. `voice_assistant: micro_wake_word: mww`
  # nie uruchamia pipeline'u samo z siebie - rdzen robi to jawnie tym samym
  # wyzwalaczem, a ja go tu pominalem. Objaw: piec wybudzen w logu i zero
  # zdarzen pipeline'u, przy satelicie stojacym w Home Assistant na `idle`.
  on_wake_word_detected:
    - lambda: id(detect_count)++;
    - if:
        condition:
          switch.is_on: tuning_mode
        then:
          # STROJENIE: samo wybudzenie, bez rozmowy. Pipeline zabralby mikrofon
          # na kilkanascie sekund i kazde nastepne "Alexa" z serii poszloby w
          # prozne, a seria jest cala metoda pomiaru.
          - logger.log: "STROJENIE: wybudzenie policzone, pipeline pominiety"
          - script.execute: blip
        else:
          # Diagnostyka: request_start() milczy, gdy asystent nie jest w IDLE, a
          # ESP_LOGE leci tylko przy braku klienta API. Zero linii po detekcji da
          # sie wiec wytlumaczyc dwojako - albo wyzwalacz nie startuje, albo
          # startuje i trafia w cichy powrot. Ta linijka to rozdziela.
          - logger.log: "TRIGGER: wybudzenie, wolam voice_assistant.start"
          - script.execute:
              id: show
              big: "ALEXA!"
              small: "slysze cie"
              col: 0x35D07F
          - voice_assistant.start:

voice_assistant:
  id: va
  microphone: clean_mic
  micro_wake_word: mww
  # Same reason as in the core: without a media player Home Assistant stops
  # offering the wake word picker and the satellite never leaves `responding`.
  media_player: box_player
  noise_suppression_level: 0     # the AFE already does this; do not do it twice
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - script.execute:
        id: show
        big: "SLUCHAM"
        small: "mow"
        col: 0x2FA8E0
  on_stt_vad_end:
    - script.execute:
        id: show
        big: "MYSLE"
        small: "..."
        col: 0xFFB020
  on_tts_start:
    - script.execute:
        id: show
        big: "ODPOWIADAM"
        small: "..."
        col: 0xB56CE0
  on_client_connected:
    # WAKE WORD JEST NA URZADZENIU, WIEC HOME ASSISTANT NIE MA GO ROBIC. Bez tej
    # linii `voice_assistant.start` z wyzwalacza detekcji nie zaklada pipeline'u:
    # w logu widac wybudzenia, w historii satelity samo `idle`. Rdzen ustawia to
    # w dwoch miejscach i to nie jest ozdobnik.
    - lambda: id(va).set_use_wake_word(false);
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
  # WAKE WORD MUSI WRACAC, I TO WIELOMA DROGAMI. Pierwsza wersja tego pliku
  # miala tylko start przy polaczeniu Home Assistant - trafienie zatrzymalo
  # wake word, pipeline nie doszedl do konca, i urzadzenie zostalo gluche na
  # stale, bez jednej linii w logu. Rdzen ma na to cztery sciezki i nie bez
  # powodu.
  on_end:
    - delay: 200ms
    - script.execute:
        id: show
        big: "NASLUCH"
        small: "powiedz Alexa"
        col: 0x2FA8E0
    - if:
        condition:
          and:
            - not:
                voice_assistant.is_running:
            - switch.is_off: mic_mute
        then:
          - micro_wake_word.start:
  on_error:
    - delay: 200ms
    - if:
        condition:
          switch.is_off: mic_mute
        then:
          - micro_wake_word.start:

interval:
  # Ostatnia deska ratunku. Jesli zaden z powyzszych nie zadzialal, po dziesieciu
  # sekundach ciszy wake word i tak wraca. Lepiej sprawdzic warunek za duzo razy
  # niz raz zostac gluchym do restartu.
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - not:
                  micro_wake_word.is_running:
              - switch.is_off: mic_mute
          then:
            - logger.log: "watchdog: wake word nie chodzil, podnosze"
            - micro_wake_word.start:
