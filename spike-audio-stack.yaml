# =============================================================================
# SPIKE, NOT A PRODUCT CONFIG. Branch `audio-stack` only.
# -----------------------------------------------------------------------------
# This exists to answer ONE question and then be thrown away or promoted:
#
#   Does the ESP32-S3-BOX-3 wire the speaker DAC back into a slot of the ES7210,
#   so that the codecs can run full duplex with a HARDWARE echo reference?
#
# Everything the box does today is half duplex by arrangement rather than by
# design: the microphone and speaker share one I2S bus, so base/core.yaml stops
# the wake word before the beep, waits for `not speaker.is_playing` before
# restarting it, and cuts the amplifier for an External-player reply. It works,
# and it costs a great deal of choreography. It also means no barge-in and no
# echo cancellation at all.
#
# github.com/n-IA-hane/esphome-audio-stack takes ownership of the codec bus and
# offers exactly what is missing: simultaneous capture and playback, plus AEC fed
# by a reference captured in the same TDM frame as the microphones. Its topology
# 6.3 assumes the DAC feedback occupies one input slot. Espressif designed the
# ESP-BOX family that way for esp-adf, but THIS repository has never verified it,
# and docs/HARDWARE.md records only "ES7210 ADC, dual microphone array".
#
# So: measure first, migrate second. The component ships TDM slot level sensors
# precisely for this, and they are the whole point of the file.
#
# -----------------------------------------------------------------------------
# HOW TO RUN IT
#
#   python scripts/flash.py <full path>/spike-audio-stack.yaml
#
# It flashes a DIFFERENT device name, so it will appear in Home Assistant as a
# new device and will NOT disturb the kitchen box's entities. It does mean
# flashing over the kitchen box, so keep a working config to hand and put the
# real one back afterwards.
#
# WHAT TO WATCH. Four sensors, one per TDM slot, publishing an audio level:
#
#   - Press "Play test tone" with the room quiet. Whichever slot moves is
#     carrying the DAC feedback: that is `tdm_ref_slot`, and it means the answer
#     is yes.
#   - Speak with nothing playing. The slots that move are the microphones.
#   - If only the microphone slots ever move, the box has no hardware reference,
#     the 6.3 topology does not apply, and the migration is not worth doing:
#     stay on the current arrangement.
#
# `tdm_ref_slot` below is a GUESS (2). Correct it once the sensors have spoken;
# the component validates only that it differs from the mic slot and fits inside
# `tdm_total_slots`, so a wrong guess reads as "that slot never moves" rather
# than as an error.
# =============================================================================

substitutions:
  name: box3-audio-spike
  friendly_name: BOX3 audio spike

  i2c_sda: GPIO8
  i2c_scl: GPIO18
  i2s_mclk: GPIO2
  i2s_bclk: GPIO17
  i2s_lrclk: GPIO45
  i2s_dout: GPIO15
  i2s_din: GPIO16
  amp_enable: GPIO46

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# Mandatory for the component, and already how the kitchen box runs.
psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  - id: i2c_bus
    sda: ${i2c_sda}
    scl: ${i2c_scl}
    scan: true
    frequency: 400kHz

external_components:
  - source: github://n-IA-hane/esphome-audio-stack@v2026.7.0
    components: [esp_audio_stack, esp_aec, esp_afe]

# The amplifier enable line. Held on for the whole spike, because a test tone
# nobody can hear proves nothing about which slot carries its feedback.
switch:
  - platform: gpio
    id: amp_on
    name: Amplifier
    pin: ${amp_enable}
    restore_mode: ALWAYS_ON
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    aec:
      name: AEC

esp_afe:
  id: afe_processor
  type: sr
  mode: low_cost
  mic_num: 1
  aec_enabled: true
  ns_enabled: true
  vad_enabled: false
  agc_enabled: true

esp_audio_stack:
  id: audio_stack
  processor_id: afe_processor
  sample_rate: 48000
  output_sample_rate: 16000
  bits_per_sample: 32
  slot_bit_width: 32

  i2s_mclk_pin: ${i2s_mclk}
  i2s_bclk_pin: ${i2s_bclk}
  i2s_lrclk_pin: ${i2s_lrclk}
  i2s_din_pin: ${i2s_din}
  i2s_dout_pin: ${i2s_dout}

  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slot: 0
  tdm_ref_slot: 2          # GUESS - this is what the sensors are here to settle
  tdm_tx_slot: 0

  codec:
    input:
      type: es7210
      address: 0x40
    output:
      type: es8311
      address: 0x18

# THE MEASUREMENT. One level sensor per slot; four because tdm_total_slots is
# four. Watch them in Home Assistant, or in the log, while playing and while
# talking.
sensor:
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    tdm_slot_levels:
      - slot: 0
        name: TDM slot 0
      - slot: 1
        name: TDM slot 1
      - slot: 2
        name: TDM slot 2
      - slot: 3
        name: TDM slot 3

microphone:
  - platform: esp_audio_stack
    id: clean_mic
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: speaker_out
    esp_audio_stack_id: audio_stack
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 500ms

# The same 180 ms wake sound the core uses, purely as something to make noise
# with on demand.
media_player:
  - platform: speaker
    id: spike_player
    name: Spike player
    announcement_pipeline:
      speaker: speaker_out
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    files:
      - id: test_tone
        file: https://github.com/MichalZaniewicz/esphome-esp32-s3-box-3-va/raw/main/base/sounds/wake.wav

button:
  - platform: template
    name: Play test tone
    on_press:
      - media_player.speaker.play_on_device_media_file:
          id: spike_player
          media_file: test_tone
          announcement: true
