###############################################################################
# Media screen: what is playing, its cover art, and three buttons.
#
# An OPTIONAL carousel screen. Add it to your thin config's `files:` list AFTER
# base/screens/home.yaml - its position in that list is its position on the
# ring - and point it at a media player:
#
#   substitutions:
#     media_entity: media_player.kitchen
#     media_ha_base_url: "http://192.168.1.10:8123"   # for the cover art
#
#   packages:
#     core:
#       files:
#         - base/core.yaml
#         - base/screens/home.yaml
#         - base/screens/media.yaml      # <- one swipe left or right from home
#         - base/faces/${assistant}.yaml
#
# It watches ANY Home Assistant media player, not this box: a speaker in the
# kitchen, the TV, whatever is named above. Wrong or missing entity is not an
# error - the screen simply says nothing is playing.
#
# THE PROGRESS BAR RUNS LOCALLY. Home Assistant sends `media_position` only when
# it changes - on play, pause and seek - so a bar drawn straight from that
# attribute would sit still for the length of a song and then jump. This screen
# takes the position it was given, notes the millisecond it arrived, and adds
# the elapsed time itself. The tick is gated on the page being visible, so on
# every other screen it costs nothing at all.
#
# THE BUTTONS FOLLOW WHAT THE PLAYER CAN ACTUALLY DO. A Chromecast casting from
# some apps has no next or previous track at all - Home Assistant answers such a
# call with `ServiceNotSupported` and nothing happens, which from the sofa looks
# exactly like a broken screen. So the player's `supported_features` bitmask is
# read, unsupported buttons are painted dim and their tap does nothing.
#
# COVER ART is downloaded by the device from whatever image proxy the player's
# `entity_picture` names. Most integrations give a PATH, which is why
# `media_ha_base_url` exists and has to be an address the BOX can reach -
# `homeassistant.local` may resolve for your laptop and not for an ESP32. Some,
# Music Assistant among them, give a complete URL instead; that one is used as
# it stands. It is fetched fresh on every track change and decoded as JPEG, which
# is what the proxy serves for practically all album art; anything else fails
# the decode and the screen falls back to the note icon, which is also what
# happens when there is no artwork at all.
###############################################################################

substitutions:
  # The player to watch. It follows `external_media_player_id` from core.yaml by
  # default, because the speaker the replies come out of is usually the speaker
  # you want to see - one line names both. Override it here when they differ: a
  # TV, a player in another room, or the BOX ITSELF, which Home Assistant names
  # media_player.<name>_<friendly_name> with both slugified. That last one is
  # the answer for a box with no external speaker at all: core.yaml's default,
  # `media_player.none`, exists nowhere, so left alone this screen correctly
  # reports that nothing is playing.
  #
  # Music Assistant note: it publishes its own entity for a speaker ALONGSIDE
  # the one from the Cast integration, and the two are not equal. The raw Cast
  # entity does not announce previous/next and does not report media_duration,
  # so with it the buttons stay dim and the progress bar has nothing to divide
  # by. Prefer the Music Assistant entity where both exist.
  media_entity: ${external_media_player_id}

  # Where the device fetches cover art from. Scheme and port included, no
  # trailing slash. Leave it at the default and the cover simply never arrives:
  # the box cannot guess your Home Assistant's address.
  media_ha_base_url: "http://homeassistant.local:8123"

  # How often the local clock advances the bar, while the page is showing. One
  # second is the coarsest that still reads as moving; the labels below it are
  # written in whole seconds anyway, and the guard means a repaint only happens
  # when the displayed second actually changes.
  media_tick: 1s

  # English by default; base/lang/*.yaml overrides these and must be listed
  # AFTER this file in `files:`. Keep them short - the screen is 320 px wide.
  media_idle_text: "Nothing playing"
  media_unknown_title: "Unknown"

  media_bg_color: '0x000000'
  media_title_color: '0xFFFFFF'
  media_artist_color: '0x8FA6C0'
  media_time_color: '0x5A6B80'
  media_bar_bg_color: '0x1A2028'
  media_bar_fg_color: '0x2FA8E0'
  media_icon_color: '0x8FA6C0'
  media_cover_bg_color: '0x11151C'
  media_button_color: '0x161A22'
  # An unsupported control. Same shape, no promise.
  media_button_off_color: '0x0C0F14'
  media_button_icon_color: '0xEAF2FF'
  media_button_icon_off_color: '0x3A4450'
  media_button_radius: '8'

font:
  # Only the five glyphs this screen draws, so the flash cost is a few KB rather
  # than a webfont. Codepoints checked against the webfont's own _variables.scss
  # - an unverified one does not fail the build, it just draws nothing, which is
  # also how a sixth one (volume-medium, F0580) sat here paying rent: the volume
  # is written as text, so nothing ever asked for the icon.
  - id: font_media_icon
    file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    size: 30
    bpp: 4
    glyphs:
      - "\U000F040A"   # play
      - "\U000F03E4"   # pause
      - "\U000F04AD"   # skip-next
      - "\U000F04AE"   # skip-previous
      - "\U000F0387"   # music-note

# Cover art. The URL here is never fetched - `update_interval: never` and the
# component only downloads when asked - but one has to be given, so it is the
# base URL you configured.
http_request:
  timeout: 5s
  watchdog_timeout: 15s

image:
  - platform: online_image
    id: media_cover
    url: "${media_ha_base_url}/"
    format: JPEG
    type: RGB565
    resize: 96x96
    buffer_size: 32768
    update_interval: never
    on_download_finished:
      # HAVING a picture and SHOWING it are two different questions, and this
      # callback only answers the first. It used to show the cover itself, which
      # outranked everything: Home Assistant hands out an `entity_picture` for a
      # stopped player too, so after a reboot the box fetched the last track's
      # art and put it on screen under "Nothing playing" - the exact thing the
      # visibility rule in media_refresh was added to prevent. One place decides.
      - lambda: |-
          id(media_cover_ready) = true;
      - lvgl.image.update:
          id: media_cover_obj
          src: media_cover
      - script.execute: media_refresh
    on_error:
      # No artwork, a format the decoder does not speak, or Home Assistant not
      # reachable - all the same thing from here: show the note instead.
      #
      # FORGET THE URL as well. The fetch guard records a picture as "seen"
      # before asking for it, so without this line a download that failed once
      # is never retried: Home Assistant republishes the same `entity_picture`,
      # the guard says "already have it", and the note stays until the track
      # changes. A blip while HA restarts should cost one repaint, not a song.
      - lambda: |-
          id(media_cover_ready) = false;
          id(media_cover_url).clear();
      - script.execute: media_refresh

text_sensor:
  - platform: homeassistant
    id: media_state
    entity_id: ${media_entity}
    internal: true
    on_value:
      # THE LOCAL CLOCK MUST ONLY RUN WHILE THE TRACK DOES. It used to run from
      # the moment Home Assistant last mentioned a position, whatever happened
      # afterwards - so the minutes a player spent paused or idle were added to
      # the position as if it had been playing, and the first track after a gap
      # opened with the bar hard against the right edge, frozen there by the
      # clamp. Pausing fixed it only because that made Home Assistant restate
      # the real position.
      #
      # So: entering `playing` starts the clock, leaving it folds however much
      # ran into the base and stops it.
      - lambda: |-
          const bool now_playing = id(media_state).state == "playing";
          if (now_playing) {
            if (id(media_pos_at) == 0) id(media_pos_at) = millis();
          } else if (id(media_pos_at) != 0) {
            id(media_pos_base) += (millis() - id(media_pos_at)) / 1000.0f;
            id(media_pos_at) = 0;
          }
      - script.execute: media_refresh
  - platform: homeassistant
    id: media_title_src
    entity_id: ${media_entity}
    attribute: media_title
    internal: true
    on_value:
      # A new track starts at zero, and Home Assistant can take a moment to say
      # so. Count from nothing until it does, rather than from where the last
      # one finished.
      - lambda: |-
          id(media_pos_base) = 0.0f;
          id(media_pos_at) = id(media_state).state == "playing" ? millis() : 0;
      - script.execute: media_refresh
  - platform: homeassistant
    id: media_artist_src
    entity_id: ${media_entity}
    attribute: media_artist
    internal: true
    on_value:
      - script.execute: media_refresh
  # The cover's address, as a PATH ("/api/media_player_proxy/...?token=..."),
  # which is why the base URL above has to exist. It carries a token, so no
  # authentication header is needed.
  - platform: homeassistant
    id: media_picture_src
    entity_id: ${media_entity}
    attribute: entity_picture
    internal: true
    on_value:
      - script.execute: media_fetch_cover

sensor:
  # The position and the moment it arrived. Everything the bar does between two
  # of these is arithmetic done here.
  - platform: homeassistant
    id: media_position_src
    entity_id: ${media_entity}
    attribute: media_position
    internal: true
    on_value:
      - lambda: |-
          id(media_pos_base) = std::isnan(x) ? 0.0f : x;
          // Anchored only while playing. Anchoring it paused too would mean the
          // pause itself gets added to the position the moment playback resumes.
          id(media_pos_at) = id(media_state).state == "playing" ? millis() : 0;
      - script.execute: media_refresh
  - platform: homeassistant
    id: media_duration_src
    entity_id: ${media_entity}
    attribute: media_duration
    internal: true
    on_value:
      - script.execute: media_refresh
  - platform: homeassistant
    id: media_volume_src
    entity_id: ${media_entity}
    attribute: volume_level
    internal: true
    on_value:
      - script.execute: media_refresh
  # What this player will actually accept. A bitmask: 16 is PREVIOUS_TRACK,
  # 32 is NEXT_TRACK. It changes with what is casting, not just with the
  # entity, so it is watched rather than read once.
  - platform: homeassistant
    id: media_features
    entity_id: ${media_entity}
    attribute: supported_features
    internal: true
    on_value:
      - script.execute: media_refresh

globals:
  - id: media_pos_base
    type: float
    restore_value: false
    initial_value: "0.0f"
  - id: media_pos_at
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: media_cover_ready
    type: bool
    restore_value: false
    initial_value: "false"
  - id: media_cover_url
    type: std::string
    restore_value: false

script:
  # Metadata, colours and the icons. Everything here changes rarely - a track
  # lasts minutes - so every write is guarded: lv_label_set_text never compares,
  # it reallocs, copies and re-lays-out, and Home Assistant republishes a state
  # on every event whether or not anything about it moved.
  - id: media_refresh
    then:
      - lambda: |-
          const std::string st = id(media_state).state;
          const bool playing = st == "playing";
          const bool active = playing || st == "paused" || st == "buffering";

          std::string title = active ? id(media_title_src).state : "${media_idle_text}";
          if (active && title.empty()) title = "${media_unknown_title}";
          std::string artist = active ? id(media_artist_src).state : "";

          static std::string seen_title, seen_artist;
          if (seen_title != title) {
            seen_title = title;
            lv_label_set_text(id(media_title), title.c_str());
          }
          if (seen_artist != artist) {
            seen_artist = artist;
            lv_label_set_text(id(media_artist), artist.c_str());
          }

          // THE COVER BELONGS TO THE TRACK, so it goes when the track does.
          // Nothing used to hide it: the download callbacks were the only thing
          // touching either widget, so when the player stopped, the last album
          // art sat there under "Nothing playing" until something else played.
          // This is also the only reader of `media_cover_ready`, which was
          // written twice and used nowhere.
          static int seen_art = -1;
          const int art = (active && id(media_cover_ready)) ? 1 : 0;
          if (seen_art != art) {
            seen_art = art;
            if (art) {
              lv_obj_add_flag(id(media_note), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(media_cover_obj), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(id(media_note), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(media_cover_obj), LV_OBJ_FLAG_HIDDEN);
            }
          }

          // The middle button shows what a TAP WILL DO, which is the opposite of
          // what is happening: a pause icon while it plays.
          static int seen_icon = -1;
          const int want = playing ? 1 : 0;
          if (seen_icon != want) {
            seen_icon = want;
            lv_label_set_text(id(media_btn_play_icon), playing ? "\U000F03E4" : "\U000F040A");
          }

          static int seen_vol = -1;
          const float v = id(media_volume_src).state;
          const int vol = (active && !std::isnan(v)) ? (int) (v * 100.0f + 0.5f) : -1;
          if (seen_vol != vol) {
            seen_vol = vol;
            char b[16];
            if (vol < 0) b[0] = '\0';
            else snprintf(b, sizeof(b), "%d%%", vol);
            lv_label_set_text(id(media_volume), b);
          }

          // Grey out what this player cannot do. Home Assistant rejects a call
          // to an unadvertised feature with ServiceNotSupported, which is
          // invisible from the sofa - so the button says so instead.
          const int sf = std::isnan(id(media_features).state)
                       ? 0 : (int) id(media_features).state;
          static int seen_sf = -1;
          if (seen_sf != sf) {
            seen_sf = sf;
            const bool prev_ok = sf & 16, next_ok = sf & 32;
            lv_obj_set_style_bg_color(id(media_btn_prev),
                lv_color_hex(prev_ok ? ${media_button_color} : ${media_button_off_color}), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(media_btn_next),
                lv_color_hex(next_ok ? ${media_button_color} : ${media_button_off_color}), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(media_btn_prev_icon),
                lv_color_hex(prev_ok ? ${media_button_icon_color} : ${media_button_icon_off_color}), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(media_btn_next_icon),
                lv_color_hex(next_ok ? ${media_button_icon_color} : ${media_button_icon_off_color}), LV_PART_MAIN);
          }
      - script.execute: media_progress

  # The bar and the two times. Called by the tick while the page is showing, and
  # once by media_refresh so a change lands immediately rather than up to a
  # second later.
  - id: media_progress
    then:
      - lambda: |-
          const std::string st = id(media_state).state;
          const bool playing = st == "playing";
          const bool active = playing || st == "paused" || st == "buffering";
          const float dur = id(media_duration_src).state;

          int pos = 0, total = 0;
          if (active && !std::isnan(dur) && dur > 0.0f) {
            total = (int) dur;
            float p = id(media_pos_base);
            // Only a PLAYING track moves on its own. Paused, the position is
            // whatever Home Assistant last said, which is the point of keeping
            // the base separately instead of trusting a running clock.
            if (playing && id(media_pos_at) != 0)
              p += (millis() - id(media_pos_at)) / 1000.0f;
            pos = (int) p;
            if (pos < 0) pos = 0;
            if (pos > total) pos = total;
          }

          static int seen_pos = -1, seen_total = -1;
          if (seen_pos == pos && seen_total == total) return;   // same second, nothing to draw
          seen_pos = pos;
          seen_total = total;

          lv_bar_set_value(id(media_bar), total > 0 ? (pos * 1000) / total : 0, LV_ANIM_OFF);

          char b[24];
          if (total > 0) snprintf(b, sizeof(b), "%d:%02d", pos / 60, pos % 60);
          else b[0] = '\0';
          lv_label_set_text(id(media_elapsed), b);
          if (total > 0) snprintf(b, sizeof(b), "%d:%02d", total / 60, total % 60);
          else b[0] = '\0';
          lv_label_set_text(id(media_total), b);

  # Cover art. Built here rather than in the text sensor's trigger because the
  # same URL arrives again on every state republish, and re-downloading a
  # picture we already have is the one expensive thing this screen can do.
  - id: media_fetch_cover
    mode: single
    then:
      # The guard lives in the condition and remembers in a global, the same
      # shape home.yaml uses for its clock: Home Assistant republishes the same
      # entity_picture on every state event, and downloading it again is the one
      # genuinely expensive thing this screen can do.
      - if:
          condition:
            lambda: |-
              const std::string pic = id(media_picture_src).state;
              if (pic.empty() || pic == id(media_cover_url)) return false;
              id(media_cover_url) = pic;
              return true;
          then:
            - online_image.set_url:
                id: media_cover
                # `entity_picture` comes in two shapes and only one of them wants
                # the base URL. The Cast integration gives a path
                # ("/api/media_player_proxy/..."), Music Assistant gives a whole
                # URL on its own image proxy port. Prefixing the second produced
                # "http://host:8123http://host:8095/..." and ESP-IDF answered
                # "Error parse url", so the cover never arrived at all.
                url: !lambda |-
                  const std::string &pic = id(media_cover_url);
                  if (pic.rfind("http://", 0) == 0 || pic.rfind("https://", 0) == 0)
                    return pic;
                  return std::string("${media_ha_base_url}") + pic;

interval:
  - interval: ${media_tick}
    then:
      - if:
          condition:
            lvgl.page.is_showing: page_media
          then:
            - script.execute: media_progress

esphome:
  on_boot:
    - priority: 800
      then:
        - logger.log:
            level: INFO
            format: "package: screens/media.yaml (media screen for ${media_entity})"
    # Paint it once, so the screen is not blank until the player next changes
    # state. Late enough that LVGL is up.
    - priority: -200
      then:
        - script.execute: media_refresh

lvgl:
  pages:
    - id: page_media
      skip: false                  # THIS is what puts the screen on the carousel
      bg_color: ${media_bg_color}
      scrollbar_mode: "OFF"
      on_swipe_left:
        - script.execute: idle_swipe_left
      on_swipe_right:
        - script.execute: idle_swipe_right
      widgets:
        # FIRST, not last, unlike carousel-example.yaml. That file has nothing to
        # tap, so its transparent button sits on top and catches everything. Here
        # the three controls have to be reachable, and LVGL hit-tests the topmost
        # object under the finger - so this one goes underneath and picks up
        # presses on the empty parts of the screen. The controls carry
        # `gesture_bubble` themselves, so a swipe that begins on a button still
        # reaches the page.
        - button:
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            gesture_bubble: true

        # The cover sits in a tile of its own, so that a missing picture leaves
        # a deliberate empty square with a note in it rather than a hole.
        - obj:
            align: TOP_LEFT
            x: 12
            y: 14
            width: 96
            height: 96
            radius: 6
            bg_color: ${media_cover_bg_color}
            bg_opa: COVER
            border_width: 0
            pad_all: 0
        - label:
            id: media_note
            align: TOP_LEFT
            x: 46
            y: 46
            text: "\U000F0387"
            text_font: font_media_icon
            text_color: ${media_icon_color}
        - image:
            id: media_cover_obj
            align: TOP_LEFT
            x: 12
            y: 14
            src: media_cover
            hidden: true

        - label:
            id: media_volume
            align: TOP_RIGHT
            x: -14
            y: 14
            text: ""
            text_font: font_body
            text_color: ${media_time_color}

        # Long titles are cut with an ellipsis rather than scrolled. A scrolling
        # label repaints for as long as it is on screen, which is exactly the
        # kind of always-on cost this project keeps taking back out.
        #
        # THE HEIGHT IS WHAT MAKES DOT MEAN ONE LINE. Left to grow on its own a
        # DOT label wraps first and only dots the last line it has room for, so
        # a two-line title grew downwards into the artist underneath it - the
        # rows are 24 px apart and a wrapped 16 px title needs about 40. Pinning
        # the height to a single row moves the ellipsis back onto line one.
        # 22 px, not 20: the glyphs are 16 px, the line box a little more.
        - label:
            id: media_title
            align: TOP_LEFT
            x: 120
            y: 40
            width: 186
            height: 22
            long_mode: DOT
            text: "${media_idle_text}"
            text_font: font_body
            text_color: ${media_title_color}
        - label:
            id: media_artist
            align: TOP_LEFT
            x: 120
            y: 64
            width: 186
            height: 22
            long_mode: DOT
            text: ""
            text_font: font_body
            text_color: ${media_artist_color}

        - bar:
            id: media_bar
            align: TOP_MID
            y: 122
            width: 292
            height: 6
            min_value: 0
            max_value: 1000
            value: 0
            bg_color: ${media_bar_bg_color}
            bg_opa: COVER
            indicator:
              bg_color: ${media_bar_fg_color}
              bg_opa: COVER
        - label:
            id: media_elapsed
            align: TOP_LEFT
            x: 14
            y: 134
            text: ""
            text_font: font_body
            text_color: ${media_time_color}
        - label:
            id: media_total
            align: TOP_RIGHT
            x: -14
            y: 134
            text: ""
            text_font: font_body
            text_color: ${media_time_color}

        # The controls act on the WATCHED PLAYER, through Home Assistant - this
        # box is not necessarily the thing making the noise. Previous and next
        # check `supported_features` first: without that a tap on a Chromecast
        # casting from an app with no track list produces a Home Assistant error
        # nobody in the kitchen can see.
        - button:
            id: media_btn_prev
            align: BOTTOM_MID
            x: -80
            y: -14
            width: 76
            height: 56
            radius: ${media_button_radius}
            bg_color: ${media_button_color}
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            gesture_bubble: true
            on_click:
              - if:
                  condition:
                    lambda: |-
                      return !std::isnan(id(media_features).state) &&
                             ((int) id(media_features).state & 16);
                  then:
                    - homeassistant.service:
                        service: media_player.media_previous_track
                        data:
                          entity_id: ${media_entity}
            widgets:
              - label:
                  id: media_btn_prev_icon
                  align: CENTER
                  text: "\U000F04AE"
                  text_font: font_media_icon
                  text_color: ${media_button_icon_color}
        - button:
            align: BOTTOM_MID
            x: 0
            y: -14
            width: 76
            height: 56
            radius: ${media_button_radius}
            bg_color: ${media_button_color}
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            gesture_bubble: true
            on_click:
              - homeassistant.service:
                  service: media_player.media_play_pause
                  data:
                    entity_id: ${media_entity}
            widgets:
              - label:
                  id: media_btn_play_icon
                  align: CENTER
                  text: "\U000F040A"
                  text_font: font_media_icon
                  text_color: ${media_button_icon_color}
        - button:
            id: media_btn_next
            align: BOTTOM_MID
            x: 80
            y: -14
            width: 76
            height: 56
            radius: ${media_button_radius}
            bg_color: ${media_button_color}
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            gesture_bubble: true
            on_click:
              - if:
                  condition:
                    lambda: |-
                      return !std::isnan(id(media_features).state) &&
                             ((int) id(media_features).state & 32);
                  then:
                    - homeassistant.service:
                        service: media_player.media_next_track
                        data:
                          entity_id: ${media_entity}
            widgets:
              - label:
                  id: media_btn_next_icon
                  align: CENTER
                  text: "\U000F04AD"
