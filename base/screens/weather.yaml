                  id: weather_hi_1
                  align: TOP_MID
                  y: 52
                  text: ""
                  text_font: font_weather_small
                  text_color: ${weather_hi_color}
              - label:
                  id: weather_lo_1
                  align: TOP_MID
                  y: 72
                  text: ""
                  text_font: font_weather_small
                  text_color: ${weather_lo_color}
        - obj:
