###############################################################################
# "Show screen": four Home Assistant buttons, one per idle screen, that jump
# the display to whichever one you press.
#
# Was a single `select` (four options, one entity) - simpler to expose, but an
# LLM conversation agent (tested: Home Assistant's OpenAI Conversation
# integration) kept reaching for the generic `turn_on` intent instead of
# `select.select_option`, which a select does not support, and failed. A
# `button` only ever does one thing - press it - so there is no service name
# or option value for the model to get wrong. Four buttons cost four widgets
# instead of one, which is the trade.
#
# NEEDS ALL FOUR SCREENS INSTALLED: home.yaml, weather.yaml, climate.yaml and
# media.yaml, in any order, all BEFORE this file. It is not narrowly scoped to
# one of them, unlike home-styles.yaml, because unlike that file - which only
# ever touches widgets home.yaml itself declares - this one has to name
# page_weather / page_climate / page_media directly, and can only do that by
# requiring the files that declare them.
#
#   packages:
#     core:
#       files:
#         - base/core.yaml
#         - base/screens/home.yaml
#         - base/screens/weather.yaml
#         - base/screens/climate.yaml
#         - base/screens/media.yaml
#         - base/screens/show-screen.yaml   # <- after all four
#
# Pressing a button sets the same two globals a horizontal swipe leaves behind
# (idle_pos, idle_page_idx - see core.yaml's CAROUSEL comment), then calls the
# core's own show_phase_page: immediately, if the device is already idle, or
# the moment the current conversation ends, if it is not. Nothing here
# interrupts an active listen/think/reply.
###############################################################################

button:
  - platform: template
    id: show_home_btn
    name: "Show home screen"
    icon: "mdi:home"
    on_press:
      - lambda: |-
          id(idle_pos) = 0;
          // Home's tap toggle switches between the clock and the character;
          // this button means the clock, the same way a fresh swipe onto the
          // home stop always would.
          id(idle_alt) = false;
          id(idle_page_idx) = (int) id(page_home)->index;
      - script.execute: show_phase_page
  - platform: template
    id: show_weather_btn
    name: "Show weather screen"
    icon: "mdi:weather-partly-cloudy"
    on_press:
      - lambda: |-
          id(idle_pos) = 0;
          id(idle_page_idx) = (int) id(page_weather)->index;
      - script.execute: show_phase_page
  - platform: template
    id: show_climate_btn
    name: "Show thermostat screen"
    icon: "mdi:thermostat"
    on_press:
      - lambda: |-
          id(idle_pos) = 0;
          id(idle_page_idx) = (int) id(page_climate)->index;
      - script.execute: show_phase_page
  - platform: template
    id: show_media_btn
    name: "Show media screen"
    icon: "mdi:play-circle"
    on_press:
      - lambda: |-
          id(idle_pos) = 0;
          id(idle_page_idx) = (int) id(page_media)->index;
      - script.execute: show_phase_page

esphome:
  on_boot:
    - priority: 800
      then:
        - logger.log:
            level: INFO
            format: "package: screens/show-screen.yaml (four \"Show ... screen\" buttons)"
