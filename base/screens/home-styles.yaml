###############################################################################
# Home styles: a live "Home style" selector for the home screen.
#
# An OPTIONAL package that rides on base/screens/home.yaml. Add it AFTER home:
#
#   files:
#     - base/core.yaml
#     - base/screens/home.yaml
#     - base/screens/home-styles.yaml   # <- adds the selector
#
# It adds a Home Assistant `select` called "Home style". Pick a look and the
# clock font, the colours, the background (solid OR a vertical gradient) AND the
# layout change live - no rebuild - and the choice survives a reboot. Only the
# home screen is touched; nothing here changes settings or any other page.
#
# A style is: PALETTE + FONT + BACKGROUND + LAYOUT. Most styles keep the default
# layout and differ by paint; Big / Terminal / Stack rearrange it; Dashboard adds
# temperature / humidity / outdoor icons with values. The small text keeps the
# main UI font so Central European accents still render.
###############################################################################

substitutions:
  # The look the device boots with - any "Home style" option (Default, CRT, Neon,
  # Minecraft, Dashboard, ...). Set it in your thin config, e.g. `home_style: CRT`.
  # The HA select restores its own saved value once you change it there, so this
  # is only the out-of-the-box default. To tune the Default look's own colours and
  # clock font at compile time instead, set the `home_*` substitutions in home.yaml.
  home_style: Default

font:
  # Clock fonts - digits and a colon only. `font_clock` (Default) is in home.yaml.
  - id: font_clock_crt
    file: { type: gfonts, family: "VT323", weight: 400 }
    size: 76
    glyphs: "0123456789:-"
  - id: font_clock_neon
    file: { type: gfonts, family: "Orbitron", weight: 700 }
    size: 60
    glyphs: "0123456789:-"
  - id: font_clock_mc
    file: { type: gfonts, family: "Press Start 2P", weight: 400 }
    size: 30
    glyphs: "0123456789:-"
  - id: font_clock_vapor
    file: { type: gfonts, family: "Monoton", weight: 400 }
    size: 52
    glyphs: "0123456789:-"
  - id: font_clock_amber
    file: { type: gfonts, family: "Audiowide", weight: 400 }
    size: 58
    glyphs: "0123456789:-"
  - id: font_clock_minimal
    file: { type: gfonts, family: "Space Mono", weight: 700 }
    size: 60
    glyphs: "0123456789:-"
  - id: font_clock_bold
    file: { type: gfonts, family: "Bungee", weight: 400 }
    size: 46
    glyphs: "0123456789:-"
  - id: font_clock_big
    file: { type: gfonts, family: "${font_family}", weight: 600 }
    size: 96
    glyphs: "0123456789:-"
  - id: font_clock_dash
    file: { type: gfonts, family: "${font_family}", weight: 400 }
    size: 48
    glyphs: "0123456789:-"
  - id: font_clock_glitch
    file: { type: gfonts, family: "Rubik Glitch", weight: 400 }
    size: 54
    glyphs: "0123456789:-"
  - id: font_clock_pixel
    file: { type: gfonts, family: "Silkscreen", weight: 400 }
    size: 44
    glyphs: "0123456789:-"
  - id: font_clock_stencil
    file: { type: gfonts, family: "Wallpoet", weight: 400 }
    size: 62
    glyphs: "0123456789:-"
  - id: font_clock_racer
    file: { type: gfonts, family: "Faster One", weight: 400 }
    size: 60
    glyphs: "0123456789:-"
  - id: font_clock_zen
    file: { type: gfonts, family: "Zen Dots", weight: 400 }
    size: 50
    glyphs: "0123456789:-"
  - id: font_clock_cyber
    file: { type: gfonts, family: "Chakra Petch", weight: 700 }
    size: 62
    glyphs: "0123456789:-"
  - id: font_clock_mono
    file: { type: gfonts, family: "Major Mono Display", weight: 400 }
    size: 52
    glyphs: "0123456789:-"
  - id: font_clock_blueprint
    file: { type: gfonts, family: "Share Tech Mono", weight: 400 }
    size: 62
    glyphs: "0123456789:-"
  # Material Design Icons for the Dashboard style. Just the three glyphs it uses -
  # thermometer, water-percent and a cloud - verified against the v7.4.47 webfont.
  - id: font_home_mdi
    file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    size: 34
    bpp: 4
    glyphs:
      - "\U000F050F"   # thermometer
      - "\U000F058E"   # water-percent (humidity)
      - "\U000F0590"   # weather-cloudy (outdoor)

# Runtime-created widgets for the Dashboard style, so home.yaml stays a clean
# home screen and all the style machinery lives here. Pointers are kept in
# globals; the widgets are children of page_home, hidden until Dashboard shows them.
globals:
  - id: dash_ready
    type: bool
    restore_value: false
    initial_value: "false"
  - id: w_it
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: w_ih
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: w_io
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: w_vt
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: w_vh
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: w_vo
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"

select:
  - platform: template
    id: home_style_select
    name: Home style
    icon: "mdi:palette"
    optimistic: true
    restore_value: true
    entity_category: config
    options:
      - Default
      - CRT
      - Neon
      - Minecraft
      - Vaporwave
      - Amber
      - Minimal
      - Bold
      - Big
      - Terminal
      - Stack
      - Dashboard
      - Sunset
      - Ocean
      - Aurora
      - Synthwave
      - Forest
      - Fire
      - Ice
      - Paper
      - Glitch
      - Pixel
      - Stencil
      - Racer
      - Zen
      - Cyber
      - Mono
      - Sunrise
      - Tide
      - Blueprint
      - RightCol
      - Corner
    initial_option: ${home_style}
    on_value:
      - script.execute: apply_home_style

script:
  # Fill the Dashboard value labels from the climate sensors. Safe to call any
  # time - it no-ops until the widgets exist, and setting text on hidden labels
  # (other styles) costs nothing anyone sees.
  - id: dash_refresh
    then:
      - lambda: |-
          if (id(w_vt) == nullptr) return;
          char b[16];
          std::string vt = std::isnan(id(room_temp).state) ? "--"
              : (snprintf(b, sizeof(b), "%.1f°", id(room_temp).state), std::string(b));
          std::string vh = std::isnan(id(room_hum).state) ? "--"
              : (snprintf(b, sizeof(b), "%.0f%%", id(room_hum).state), std::string(b));
          std::string vo = std::isnan(id(outdoor_temp).state) ? "--"
              : (snprintf(b, sizeof(b), "%.1f°", id(outdoor_temp).state), std::string(b));
          lv_label_set_text(id(w_vt), vt.c_str());
          lv_label_set_text(id(w_vh), vh.c_str());
          lv_label_set_text(id(w_vo), vo.c_str());

  - id: apply_home_style
    then:
      - lambda: |-
          const std::string s = id(home_style_select).current_option();

          // ---- PALETTE + FONT + BACKGROUND -----------------------------------
          const font::Font *f = id(font_clock);
          uint32_t bg = ${home_bg_color},   ck = ${home_clock_color},
                   dt = ${home_date_color}, hn = ${home_hint_color},
                   cl = ${home_climate_color};
          uint32_t g2 = bg;   // gradient bottom; == bg means solid
          int grad = 0;       // 0 solid, 1 vertical gradient
          int layout = 0;     // 0 default, 1 big, 2 terminal, 3 stack, 4 dashboard

          if (s == "CRT")            { f = id(font_clock_crt);     bg = 0x040A04; ck = 0x4DFF7A; dt = 0x2AAE4C; hn = 0x1C8038; cl = 0x38D661; }
          else if (s == "Neon")      { f = id(font_clock_neon);    bg = 0x050014; ck = 0x00E5FF; dt = 0xFF3DDA; hn = 0x6E33FF; cl = 0x00E5FF; }
          else if (s == "Minecraft") { f = id(font_clock_mc);      bg = 0x1E1508; ck = 0x7FD34F; dt = 0xC7A15A; hn = 0x6B5836; cl = 0x7FD34F; }
          else if (s == "Vaporwave") { f = id(font_clock_vapor);   bg = 0x1B0A33; ck = 0xFF71CE; dt = 0x8A7CFF; hn = 0x5A4E9E; cl = 0x71F7FF; }
          else if (s == "Amber")     { f = id(font_clock_amber);   bg = 0x0A0500; ck = 0xFFB021; dt = 0xB3760F; hn = 0x7A5008; cl = 0xFFA833; }
          else if (s == "Minimal")   { f = id(font_clock_minimal); bg = 0x0B0B0B; ck = 0xF4F4F4; dt = 0x6E6E6E; hn = 0x454545; cl = 0x9C9C9C; }
          else if (s == "Bold")      { f = id(font_clock_bold);    bg = 0x0E0E12; ck = 0xFFD400; dt = 0xFF5252; hn = 0x7A7A7A; cl = 0x2FE08A; }
          else if (s == "Big")       { f = id(font_clock_big);     bg = 0x000000; ck = 0xFFFFFF; dt = 0x8A8A8A; hn = 0x5A5A5A; cl = 0xC8C8C8; layout = 1; }
          else if (s == "Terminal")  { f = id(font_clock_crt);     bg = 0x030803; ck = 0x54FF7E; dt = 0x2AAE4C; hn = 0x1C8038; cl = 0x3ED869; layout = 2; }
          else if (s == "Stack")     { f = id(font_clock);         bg = 0x0A0E14; ck = 0xEAF2FF; dt = 0x6FA8DC; hn = 0x3D5A80; cl = 0x9FC0E8; layout = 3; }
          else if (s == "Dashboard") { f = id(font_clock_dash);    bg = 0x0C1016; ck = 0xEAF2FF; dt = 0x8FA6C0; hn = 0x4A5A70; cl = 0xEAF2FF; layout = 4; }
          else if (s == "Sunset")    { f = id(font_clock);         bg = 0x2A0A2E; g2 = 0xFF7A3D; grad = 1; ck = 0xFFE0B0; dt = 0xFFB07A; hn = 0xC77A5A; cl = 0xFFCF9A; }
          else if (s == "Ocean")     { f = id(font_clock);         bg = 0x02121F; g2 = 0x0A6E7A; grad = 1; ck = 0xEAFBFF; dt = 0x7FD4E0; hn = 0x3F7A86; cl = 0xBFEFF6; }
          else if (s == "Aurora")    { f = id(font_clock);         bg = 0x08202A; g2 = 0x2E1A4A; grad = 1; ck = 0x8FFFD0; dt = 0x6FE0C0; hn = 0x4A8A8A; cl = 0xB0FFE6; }
          else if (s == "Synthwave") { f = id(font_clock_neon);    bg = 0x160A2E; g2 = 0x3A0A4A; grad = 1; ck = 0xFF3DDA; dt = 0x00E5FF; hn = 0x6E33FF; cl = 0x00E5FF; }
          else if (s == "Forest")    { f = id(font_clock);         bg = 0x03140A; g2 = 0x0A3A1E; grad = 1; ck = 0xB8F0A8; dt = 0x7FC77A; hn = 0x4A7A44; cl = 0xCDEFC0; }
          else if (s == "Fire")      { f = id(font_clock_bold);    bg = 0x1A0603; g2 = 0x7A1A08; grad = 1; ck = 0xFFD24D; dt = 0xFF8A3D; hn = 0xC7663A; cl = 0xFFB86A; }
          else if (s == "Ice")       { f = id(font_clock);         bg = 0x0A1A2E; g2 = 0x2A5A8A; grad = 1; ck = 0xF2FAFF; dt = 0xAFD6F0; hn = 0x6A93B8; cl = 0xD6ECFA; }
          else if (s == "Paper")     { f = id(font_clock);         bg = 0xEDEAE2; ck = 0x1A1A1A; dt = 0x555555; hn = 0x8A8A8A; cl = 0x333333; }
          else if (s == "Glitch")    { f = id(font_clock_glitch);   bg = 0x0A0014; ck = 0xFF2E88; dt = 0x2EE6FF; hn = 0x7A2E6E; cl = 0xFF2E88; }
          else if (s == "Pixel")     { f = id(font_clock_pixel);    bg = 0x001818; ck = 0x35F0C0; dt = 0x1E9E86; hn = 0x155E52; cl = 0x35F0C0; }
          else if (s == "Stencil")   { f = id(font_clock_stencil);  bg = 0x141410; ck = 0xE8C848; dt = 0x9A8636; hn = 0x6E5E24; cl = 0xD8BC58; }
          else if (s == "Racer")     { f = id(font_clock_racer);    bg = 0x120303; ck = 0xFF3B3B; dt = 0xFFB03B; hn = 0x8A2E2E; cl = 0xFF7A5A; }
          else if (s == "Zen")       { f = id(font_clock_zen);      bg = 0x0E1420; ck = 0xE6EEF7; dt = 0x8FA6C7; hn = 0x4A5A75; cl = 0xC7D6EC; }
          else if (s == "Cyber")     { f = id(font_clock_cyber);    bg = 0x0A0E06; ck = 0xE6FF3B; dt = 0x3BE6FF; hn = 0x6E7A3B; cl = 0xB6E63B; }
          else if (s == "Mono")      { f = id(font_clock_mono);     bg = 0x0D0D0D; ck = 0xEDEDED; dt = 0x8A8A8A; hn = 0x555555; cl = 0xC0C0C0; }
          else if (s == "Sunrise")   { f = id(font_clock);          bg = 0x2A0A2E; g2 = 0xFFB24D; grad = 2; ck = 0xFFF0E0; dt = 0xFFCF9A; hn = 0xC77A5A; cl = 0xFFE0B8; }
          else if (s == "Tide")      { f = id(font_clock);          bg = 0x02121F; g2 = 0x0A6E7A; grad = 2; ck = 0xEAFBFF; dt = 0x7FD4E0; hn = 0x3F7A86; cl = 0xBFEFF6; }
          else if (s == "Blueprint") { f = id(font_clock_blueprint); bg = 0xD8E6F2; ck = 0x113A66; dt = 0x3A6A96; hn = 0x6A8AAE; cl = 0x224A76; }
          else if (s == "RightCol")  { f = id(font_clock);          bg = 0x0A0700; ck = 0xFFB021; dt = 0xB3760F; hn = 0x7A5008; cl = 0xFFA833; layout = 5; }
          else if (s == "Corner")    { f = id(font_clock_dash);     bg = 0x0B0B0B; ck = 0xF4F4F4; dt = 0x6E6E6E; hn = 0x454545; cl = 0x9C9C9C; layout = 6; }

          lv_obj_t *p = id(page_home)->obj;
          lv_obj_set_style_bg_color(p, lv_color_hex(bg), LV_PART_MAIN);
          lv_obj_set_style_bg_grad_color(p, lv_color_hex(g2), LV_PART_MAIN);
          lv_grad_dir_t gdir = grad == 2 ? LV_GRAD_DIR_HOR
                             : grad == 1 ? LV_GRAD_DIR_VER : LV_GRAD_DIR_NONE;
          lv_obj_set_style_bg_grad_dir(p, gdir, LV_PART_MAIN);

          lv_obj_set_style_text_font(id(home_clock), f->get_lv_font(), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(home_clock),   lv_color_hex(ck), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(home_date),    lv_color_hex(dt), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(home_hint),    lv_color_hex(hn), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(home_indoor),  lv_color_hex(cl), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(home_outdoor), lv_color_hex(cl), LV_PART_MAIN);

          // ---- LAYOUT --------------------------------------------------------
          lv_obj_t *clock = id(home_clock), *date = id(home_date), *hint = id(home_hint),
                   *ind = id(home_indoor), *out = id(home_outdoor);
          auto show = [](lv_obj_t *o){ if(o) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN); };
          auto hide = [](lv_obj_t *o){ if(o) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); };
          auto talign = [](lv_obj_t *o, lv_text_align_t a){ lv_obj_set_style_text_align(o, a, 0); };

          // Dashboard widgets are hidden for every layout, then shown by Dashboard.
          lv_obj_t *dashw[6] = {id(w_it),id(w_ih),id(w_io),id(w_vt),id(w_vh),id(w_vo)};
          for (int i=0;i<6;i++) hide(dashw[i]);

          if (layout == 1) {                 // BIG: just the clock, centred
            show(clock); hide(date); hide(hint); hide(ind); hide(out);
            lv_obj_align(clock, LV_ALIGN_CENTER, 0, 0);
          } else if (layout == 2) {          // TERMINAL: left column, console
            show(clock); show(date); hide(hint); show(ind); show(out);
            talign(clock, LV_TEXT_ALIGN_LEFT); talign(date, LV_TEXT_ALIGN_LEFT);
            talign(ind, LV_TEXT_ALIGN_LEFT);   talign(out, LV_TEXT_ALIGN_LEFT);
            lv_obj_align(date,  LV_ALIGN_TOP_LEFT, 14, 18);
            lv_obj_align(clock, LV_ALIGN_TOP_LEFT, 12, 58);
            lv_obj_align(ind,   LV_ALIGN_TOP_LEFT, 14, 150);
            lv_obj_align(out,   LV_ALIGN_TOP_LEFT, 14, 178);
          } else if (layout == 3) {          // STACK: centred vertical
            show(clock); show(date); hide(hint); show(ind); show(out);
            talign(date, LV_TEXT_ALIGN_CENTER);
            talign(ind, LV_TEXT_ALIGN_CENTER); talign(out, LV_TEXT_ALIGN_CENTER);
            lv_obj_align(clock, LV_ALIGN_CENTER, 0, -40);
            lv_obj_align(date,  LV_ALIGN_CENTER, 0, 24);
            lv_obj_align(ind,   LV_ALIGN_CENTER, 0, 58);
            lv_obj_align(out,   LV_ALIGN_CENTER, 0, 84);
          } else if (layout == 4) {          // DASHBOARD: clock + icon/value tiles
            show(clock); hide(date); hide(hint); hide(ind); hide(out);
            talign(clock, LV_TEXT_ALIGN_CENTER);
            lv_obj_align(clock, LV_ALIGN_CENTER, 0, -54);
            lv_obj_t *ic[3] = {id(w_it),id(w_ih),id(w_io)};
            lv_obj_t *vl[3] = {id(w_vt),id(w_vh),id(w_vo)};
            int dx[3] = {-96, 0, 96};
            for (int i=0;i<3;i++){
              if(!ic[i]) continue;
              show(ic[i]); lv_obj_align(ic[i], LV_ALIGN_CENTER, dx[i], 30);
              lv_obj_set_style_text_color(ic[i], lv_color_hex(0x3AFAE6), 0);
              show(vl[i]); lv_obj_align(vl[i], LV_ALIGN_CENTER, dx[i], 66);
              lv_obj_set_style_text_align(vl[i], LV_TEXT_ALIGN_CENTER, 0);
              lv_obj_set_style_text_color(vl[i], lv_color_hex(cl), 0);
            }
          } else if (layout == 5) {          // RIGHTCOL: right-aligned column
            show(clock); show(date); hide(hint); show(ind); show(out);
            talign(clock, LV_TEXT_ALIGN_RIGHT); talign(date, LV_TEXT_ALIGN_RIGHT);
            talign(ind, LV_TEXT_ALIGN_RIGHT); talign(out, LV_TEXT_ALIGN_RIGHT);
            lv_obj_align(date,  LV_ALIGN_TOP_RIGHT, -14, 18);
            lv_obj_align(clock, LV_ALIGN_TOP_RIGHT, -12, 58);
            lv_obj_align(ind,   LV_ALIGN_TOP_RIGHT, -14, 150);
            lv_obj_align(out,   LV_ALIGN_TOP_RIGHT, -14, 178);
          } else if (layout == 6) {          // CORNER: small clock in the top-left
            show(clock); show(date); hide(hint); show(ind); show(out);
            talign(clock, LV_TEXT_ALIGN_LEFT); talign(date, LV_TEXT_ALIGN_LEFT);
            talign(ind, LV_TEXT_ALIGN_LEFT); talign(out, LV_TEXT_ALIGN_LEFT);
            lv_obj_align(clock, LV_ALIGN_TOP_LEFT, 14, 10);
            lv_obj_align(date,  LV_ALIGN_TOP_LEFT, 16, 64);
            lv_obj_align(ind,   LV_ALIGN_BOTTOM_LEFT, 14, -46);
            lv_obj_align(out,   LV_ALIGN_BOTTOM_LEFT, 14, -22);
          } else {                           // DEFAULT: the home.yaml layout
            show(clock); show(date); show(hint); show(ind); show(out);
            talign(clock, LV_TEXT_ALIGN_CENTER); talign(date, LV_TEXT_ALIGN_LEFT);
            talign(ind, LV_TEXT_ALIGN_LEFT); talign(out, LV_TEXT_ALIGN_RIGHT);
            lv_obj_align(clock, LV_ALIGN_CENTER, 0, -14);
            lv_obj_align(date,  LV_ALIGN_TOP_LEFT, 12, 10);
            lv_obj_align(hint,  LV_ALIGN_CENTER, 0, 32);
            lv_obj_align(ind,   LV_ALIGN_BOTTOM_LEFT, 12, -24);
            lv_obj_align(out,   LV_ALIGN_BOTTOM_RIGHT, -12, -24);
          }

          lv_obj_invalidate(p);
      # Keep the Dashboard values current on every switch (no-ops elsewhere).
      - script.execute: dash_refresh

# Refresh the Dashboard values while it is the screen you are looking at. Climate
# moves slowly, so this is gentle and gated on the page being visible.
interval:
  - interval: 20s
    then:
      - if:
          condition:
            and:
              - lambda: return id(home_style_select).current_option() == "Dashboard";
              - lvgl.page.is_showing: page_home
          then:
            - script.execute: dash_refresh

esphome:
  on_boot:
    - priority: 800
      then:
        - logger.log:
            level: INFO
            format: "package: screens/home-styles.yaml (live Home style selector)"
    # Build the Dashboard widgets once, after LVGL is up. Runs BEFORE the style
    # apply below (higher priority = earlier), so the pointers exist by then.
    - priority: -190
      then:
        - lambda: |-
            if (id(dash_ready)) return;
            id(dash_ready) = true;
            lv_obj_t *p = id(page_home)->obj;
            auto ico = [&](const char *g){ lv_obj_t *o = lv_label_create(p);
              lv_obj_set_style_text_font(o, id(font_home_mdi)->get_lv_font(), 0);
              lv_label_set_text(o, g); lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); return o; };
            auto val = [&](){ lv_obj_t *o = lv_label_create(p);
              lv_obj_set_style_text_font(o, id(font_home_small)->get_lv_font(), 0);
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); return o; };
            id(w_it) = ico("\U000F050F"); id(w_ih) = ico("\U000F058E"); id(w_io) = ico("\U000F0590");
            id(w_vt) = val(); id(w_vh) = val(); id(w_vo) = val();
    # Apply the restored style. A template select restores its value but does not
    # fire its on_value at boot, so this does the first paint.
    - priority: -200
      then:
        - script.execute: apply_home_style
