###############################################################################
# Swipe screens: two placeholders for home's VERTICAL neighbours.
#
# MOCKUPS. They carry a title and a hint and nothing else - the point of this
# package is the navigation, not the content. Replace the bodies once the
# movement feels right, or point the substitutions at real screens instead.
#
# An OPTIONAL package. Add it after `base/screens/home.yaml` and point the two
# vertical substitutions at these pages:
#
#   packages:
#     core:
#       files:
#         - base/core.yaml
#         - base/screens/home.yaml
#         - base/screens/swipe.yaml
#   substitutions:
#     idle_page:      page_home
#     idle_page_alt:  page_face
#     idle_page_above: page_swipe_up      # swipe DOWN brings it in from the top
#     idle_page_below: page_swipe_down    # swipe UP brings it in from the bottom
#
# These are the two VERTICAL neighbours only. The HORIZONTAL axis is a carousel
# and works differently - a screen joins it by being a `skip: false` page, not by
# a substitution. To add horizontal screens, copy base/screens/carousel-example.yaml;
# see base/screens/CAROUSEL.md.
#
# Vertical is one level deep and does not loop: swipe up from home and the BOTTOM
# screen rises into view, swipe down and you are back. It belongs to home - these
# are not reachable from the other carousel screens.
#
# What happens during a conversation: the assistant takes the screen as it always
# has, and when it finishes you are put back on whichever screen you were reading.
# That is `idle_pos` in the core doing the work - see the swipe scripts there.
###############################################################################

substitutions:
  swipe_title_font: font_home_small
  swipe_bg_color: '0x000000'
  swipe_title_color: '0xFFFFFF'
  swipe_hint_color: '0x5A5A5A'
  # Shown small under each title, so it is obvious which gesture got you here.
  swipe_up_title: "Ekran górny"
  swipe_up_hint: "swipe w dół z home"
  swipe_down_title: "Ekran dolny"
  swipe_down_hint: "swipe w górę z home"

lvgl:
  pages:
    # `skip: true` keeps these vertical neighbours out of the horizontal carousel
    # (`lvgl.page.next` / `previous`); they are reached by name through the
    # idle_page_above / idle_page_below substitutions, not by a left/right swipe.
    - id: page_swipe_up
      skip: true
      bg_color: ${swipe_bg_color}
      on_swipe_up:
        - script.execute: idle_swipe_up
      on_swipe_down:
        - script.execute: idle_swipe_down
      widgets:
        - label:
            align: CENTER
            y: -12
            text: "${swipe_up_title}"
            text_font: ${swipe_title_font}
            text_color: ${swipe_title_color}
        - label:
            align: CENTER
            y: 14
            text: "${swipe_up_hint}"
            text_font: ${swipe_title_font}
            text_color: ${swipe_hint_color}

    - id: page_swipe_down
      skip: true
      bg_color: ${swipe_bg_color}
      on_swipe_up:
        - script.execute: idle_swipe_up
      on_swipe_down:
        - script.execute: idle_swipe_down
      widgets:
        - label:
            align: CENTER
            y: -12
            text: "${swipe_down_title}"
            text_font: ${swipe_title_font}
            text_color: ${swipe_title_color}
        - label:
            align: CENTER
            y: 14
            text: "${swipe_down_hint}"
            text_font: ${swipe_title_font}
            text_color: ${swipe_hint_color}
