            height: 206
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            gesture_bubble: true
            widgets:
              - label:
                  align: CENTER
                  y: -14
                  text: "\U000F0B66"
