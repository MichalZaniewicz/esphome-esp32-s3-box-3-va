###############################################################################
# Canvas: a screen Home Assistant draws on, not one you swipe to.
#
# Two doors, one drawing engine. A native API service, `draw_on_screen`
# (shows up in Home Assistant as `esphome.<your device name>_draw_on_screen`),
# takes the spec as a plain call parameter - no length limit, because it is
# never stored as an entity's state. A `text` entity, "Draw on screen", does
# the same thing for quick manual testing from the HA UI, capped at 255
# characters because entity state itself is capped at 255 characters
# (Home Assistant's limit, not this file's - weather.yaml's header runs into
# the same wall). Both call the same script, `canvas_draw`, so there is one
# parser, not two. Either way the device draws on a blank page and switches
# to it on its own - no button, no swipe, no way to reach it from the Box
# itself. That is deliberate: nothing on the device names it, so the only way
# in is Home Assistant.
#
# NEEDS NOTHING BUT base/core.yaml - it does not touch or require any other
# screen, unlike base/screens/show-screen.yaml.
#
#   packages:
#     core:
#       files:
#         - base/core.yaml
#         - base/screens/canvas.yaml
#
# THE SERVICE IS THE ONE TO CALL FROM VOICE. Wrap it in a Home Assistant
# `script:` with one text field and call THAT from Assist - a bare
# `esphome.xxx_draw_on_screen` service is not something Assist reliably
# reaches for any more than it reliably reached for `select.select_option`
# (see base/screens/show-screen.yaml's header); a script with one field is
# the same "reduce it to one unambiguous action" fix, just carrying a string
# instead of nothing.
#
# THE SPEC IS A SMALL TEXT FORMAT, not JSON - the same choice weather.yaml and
# climate.yaml already made for the same reason: a hand-written walk over
# find()/substr() is something this file can parse without pulling in a JSON
# library whose availability in a raw lambda isn't a given. One element per
# line, elements separated by "|", fields within an element by ",":
#
#   rect,X,Y,W,H,RADIUS,RRGGBB
#   circle,CX,CY,R,RRGGBB
#   text,X,Y,SIZE,RRGGBB,label text
#   icon,X,Y,SIZE,RRGGBB,name
#
# CIRCLE is RECT underneath - centred, W=H=2*R, radius clamped to a circle by
# LVGL (the trick base/faces/iris.yaml's sclera already uses) - it exists as
# its own word because centre+radius is what a person (or a model) reaches
# for, not top-left-corner-of-the-bounding-box maths. Both share one pool, so
# a spec with rects AND circles still only gets 16 of them combined. NO
# DIAGONAL LINES: `lv_line` is not compiled into this build's LVGL at all
# (confirmed on hardware - "lv_line_create was not declared in this scope"),
# and a rect substitutes fine for anything axis-aligned. SIZE for text is 0
# (small, 16px), 1 (medium, 24px) or 2 (large, 40px). Colour is six hex
# digits, no "#". Every coordinate is pixels on the device's native 320x240.
# A shape past its pool (16 rect/circle, 8 text, 6 icon - 30 elements total)
# in one spec is dropped, not queued - the pools are fixed at boot, never
# reallocated per draw. Through the service that is the real ceiling; through
# the 255-character text entity, the character limit runs out first, around
# 8-12 short elements.
#
# ICON draws one Material Design glyph. `name` is one of a small, fixed list -
# every codepoint here is one already shipped and confirmed drawing correctly
# somewhere else in this repo (weather.yaml's condition icons, climate.yaml's
# flame, home-styles.yaml's thermometer/droplet), not a freshly guessed one,
# because a wrong MDI codepoint does not fail the build, it just draws
# nothing:
#   sun cloud partly-cloudy rain pouring snow snow-rain fog hail lightning
#   storm wind wind2 night alert thermometer humidity fire minus plus
# SIZE 0 is 24px, anything else is 48px - two sizes, not three, because an
# icon at font_body's 16px is not legible from across a kitchen.
#
# A little sun, off-centre - the hand-built version and the icon version:
#   rect,140,80,40,40,999,FFD700|rect,155,58,10,16,0,FFD700|rect,155,126,10,16,0,FFD700|rect,108,95,16,10,0,FFD700|rect,196,95,16,10,0,FFD700|text,120,180,1,FFFFFF,Slonko
#   icon,140,80,1,FFD700,sun
#
# A bar chart is just rects of different heights, bottom-aligned, which is
# what "narysuj wykres temperatury na 24h" actually needs - no diagonal lines
# anywhere in this file's vocabulary, and a bar chart never wanted one:
#   rect,20,140,20,60,0,FF8A3D|rect,50,120,20,80,0,FF8A3D|rect,80,90,20,110,0,FF8A3D|text,20,205,0,8FA6C0,6|text,50,205,0,8FA6C0,12|text,80,205,0,8FA6C0,18
#
# TEMPLATES: nine more words, each ITS OWN element type at the top level
# (still separated from its neighbours by |), that expand into rect/text/icon
# on your behalf so the model stops doing layout maths by hand. A template's
# OWN field list is comma-separated same as any element; where a template
# needs a variable-length list of entries, that list is the last field and
# uses ";" between entries and ":" between an entry's own sub-values - chosen
# specifically so neither collides with the "|" a template is itself sitting
# inside. Every number a template takes is a raw value, not a pixel - the
# template does its own scaling. Any title/subtitle/icon argument below can
# be "" to skip it and reclaim its pool slot for something else. Past each
# template's own entry cap, extra entries are silently dropped, same as a
# shape past its pool.
#
#   bar_chart,title,subtitle,unit,RRGGBB,v1;v2;v3;...          up to 8 bars
#     Bars auto-scale between the given values' own min and max - you supply
#     the numbers, not the heights. unit is appended after each number above
#     its bar ("12" + "°" -> "12°"). Colour is one flat RRGGBB for every bar,
#     so "wykres opadów" is this same word with a blue colour, not a
#     separate template - a fractional value like "0.5" prints with one
#     decimal, a whole one prints bare.
#       bar_chart,Temperatura (°C),6:00-18:00 co 3h,°,FF8A3D,12;15;19;18;14
#
#   list,title,icon:label;icon:label;...                        up to 8 rows
#     One icon (optional, "" for none) + one line per row - the line already
#     carries its own value ("Salon 21°C"), this template only handles the
#     row spacing.
#       list,W domu,thermometer:Salon 21°C;thermometer:Kuchnia 23°C
#
#   forecast,title,icon:day:temp;icon:day:temp;...            up to 4 columns
#     The weather.yaml day-column look, lighter: up to 3 columns with a
#     title, 4 without (8 text slots is the hard ceiling either way).
#       forecast,Prognoza,sun:Pon:18°/9°;rain:Wt:14°/7°;partly-cloudy:Sr:16°/8°
#
#   gauge,title,label:pct;label:pct;...                          up to 4 bars
#     A 0-100 value as a filled track instead of a bare number without
#     context (humidity, battery, volume). pct is clamped to 0..100.
#       gauge,Czujniki,Wilgotnosc:65;Bateria czujnika:40
#
#   stat,icon,value,label,sub                                     fixed shape
#     One big number/short string, for when that is the entire answer
#     ("jaka temperatura na zewnatrz"). icon and sub can both be "".
#       stat,partly-cloudy,8°,Na zewnatrz,Wiatr 12 km/h
#
#   status,title,label:RRGGBB:state;label:RRGGBB:state;...       up to 4 rows
#     Two columns, name then state - color is explicit per row (same
#     convention as every other element here) rather than guessed from the
#     state word, so "otwarte"/"open"/whatever you write comes out in
#     whatever colour you pick.
#       status,Czujniki drzwi,Drzwi wejsciowe:6FD08A:Zamkniete;Okno kuchnia:FF8A3D:Otwarte
#
#   compare,title,name_a,name_b,label:va:vb;label:va:vb;...  up to 4 pairs
#     Two series side by side, scaled together off one shared min/max so the
#     bars stay comparable. Series A is always the accent colour, series B
#     is always the secondary blue-grey - not a per-call choice.
#       compare,Zuzycie energii,Dzis,Wczoraj,Rano:40:55;Popol:70:50;Wiecz:90:100
#
#   banner,icon,message,sub                                       fixed shape
#     A short message with nothing else to say ("napisz mi ze pranie sie
#     skonczylo") - centred automatically (LV_ALIGN_TOP_MID on a fixed-width
#     label), not at an X the model would otherwise have to guess. icon and
#     sub can both be "".
#       banner,alert,Pranie skonczone,Kuchnia - przed chwila
#
#   grid,title,icon:value;icon:value;icon:value;icon:value        up to 4 tiles
#     A 2x2 quick-glance dashboard instead of a vertical list, for when more
#     than one topic needs to fit at once (climate + heating together).
#       grid,Salon - teraz,thermometer:21°C;humidity:48%;wind:12 km/h;fire:Piec ON
#
# Setting the text entity to "" clears every shape but does NOT switch the
# screen to a blank page - only a non-empty spec does that.
#
# TAP OR SWIPE THE SCREEN WHILE IT IS SHOWING TO DISMISS IT: the device
# remembers exactly what was on screen the moment Home Assistant first put
# the drawing up (idle_pos, idle_page_idx, idle_alt) and restores precisely
# that, not just "the next carousel stop". Drawing again while already on
# this screen does not re-arm that memory - only a transition INTO the
# drawing from something else does.
###############################################################################

substitutions:
  canvas_bg_color: '0x000000'

font:
  - id: font_canvas_med
    file: { type: gfonts, family: "${font_family}", weight: 400 }
    size: 24
    glyphsets:
      - ${font_glyphsets}
  - id: font_canvas_lg
    file: { type: gfonts, family: "${font_family}", weight: 500 }
    size: 40
    glyphsets:
      - ${font_glyphsets}
  # Small text reuses font_body (16px, already compiled for every build) -
  # a third font asset here would cost flash for a size font_body already is.
  # Every glyph below is a codepoint already verified elsewhere in this repo -
  # see weather.yaml, climate.yaml and home-styles.yaml for where each one
  # first shipped - not a freshly guessed one.
  - id: font_canvas_icon_s
    file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    size: 24
    bpp: 4
    glyphs: &canvas_icon_glyphs
      - "\U000F0599"   # sun            weather-sunny
      - "\U000F0590"   # cloud          weather-cloudy
      - "\U000F0595"   # partly-cloudy  weather-partly-cloudy
      - "\U000F0597"   # rain           weather-rainy
      - "\U000F0596"   # pouring        weather-pouring
      - "\U000F0598"   # snow           weather-snowy
      - "\U000F067F"   # snow-rain      weather-snowy-rainy
      - "\U000F0591"   # fog            weather-fog
      - "\U000F0592"   # hail           weather-hail
      - "\U000F0593"   # lightning      weather-lightning
      - "\U000F067E"   # storm          weather-lightning-rainy
      - "\U000F059D"   # wind           weather-windy
      - "\U000F059E"   # wind2          weather-windy-variant
      - "\U000F0594"   # night          weather-night
      - "\U000F0F2F"   # alert          weather-cloudy-alert (also the unknown-name fallback)
      - "\U000F050F"   # thermometer
      - "\U000F058E"   # humidity       water-percent
      - "\U000F0238"   # fire
      - "\U000F0374"   # minus
      - "\U000F0415"   # plus
  - id: font_canvas_icon_l
    file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    size: 48
    bpp: 4
    glyphs: *canvas_icon_glyphs

globals:
  - id: canvas_ready
    type: bool
    restore_value: false
    initial_value: "false"
  # Whether the drawing currently owns the idle screen, and what to restore
  # when it lets go - a snapshot of the three globals that together describe
  # "what was on screen", taken once at the moment Home Assistant first puts
  # a drawing up, not touched again until it is dismissed.
  - id: canvas_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: canvas_prev_pos
    type: int
    restore_value: false
    initial_value: "0"
  - id: canvas_prev_idx
    type: int
    restore_value: false
    initial_value: "0"
  - id: canvas_prev_alt
    type: bool
    restore_value: false
    initial_value: "false"
  # Set by canvas_draw, read by the step right after it - see the comment
  # there. Not meaningful outside that one handoff.
  - id: canvas_had_content
    type: bool
    restore_value: false
    initial_value: "false"
  - id: canvas_shape_0
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: canvas_shape_1
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: canvas_shape_2
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: canvas_shape_3
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: canvas_shape_4
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: canvas_shape_5
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: canvas_shape_6
    type: lv_obj_t*
    restore_value: false
