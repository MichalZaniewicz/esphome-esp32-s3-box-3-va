  - id: canvas_shape_9
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: canvas_shape_10
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: canvas_shape_11
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: canvas_shape_12
    type: lv_obj_t*
    restore_value: false
    initial_value: "nullptr"
  - id: canvas_shape_13
    type: lv_obj_t*
    restore_value: false
