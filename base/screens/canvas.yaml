# A plain HA entity state is capped at 255 characters, which the drawing
# spec runs into fast (see the substitutions header above). Home Assistant
# script FIELDS have no such cap - they are just call parameters, never
# persisted as a state - so the real drawing entry point is the native API
# service below, which a Home Assistant `script:` calls directly, bypassing
# entity state entirely. The `text` entity still exists and still draws
# (via the same shared `canvas_draw` script both paths call into) - it is
# just no longer the only door in, so it can stay capped at 255 for quick
# manual testing from the HA UI without anyone hitting a wall.
api:
  services:
    - service: draw_on_screen
      variables:
        spec: string
      then:
        - script.execute:
            id: canvas_draw
            spec: !lambda 'return spec;'

text:
  - platform: template
    id: canvas_spec
    name: "Draw on screen"
    icon: "mdi:draw"
    mode: text
    optimistic: true
    min_length: 0
    max_length: 255
    on_value:
      - script.execute:
          id: canvas_draw
          spec: !lambda 'return id(canvas_spec).state;'

script:
  - id: canvas_draw
    mode: single
    parameters:
      spec: string
    then:
      - lambda: |-
          lv_obj_t *shapes[16] = {id(canvas_shape_0),id(canvas_shape_1),id(canvas_shape_2),id(canvas_shape_3),
                                  id(canvas_shape_4),id(canvas_shape_5),id(canvas_shape_6),id(canvas_shape_7),
                                  id(canvas_shape_8),id(canvas_shape_9),id(canvas_shape_10),id(canvas_shape_11),
                                  id(canvas_shape_12),id(canvas_shape_13),id(canvas_shape_14),id(canvas_shape_15)};
          lv_obj_t *texts[8] = {id(canvas_text_0),id(canvas_text_1),id(canvas_text_2),id(canvas_text_3),
                                id(canvas_text_4),id(canvas_text_5),id(canvas_text_6),id(canvas_text_7)};
          lv_obj_t *icons[6] = {id(canvas_icon_0),id(canvas_icon_1),id(canvas_icon_2),
                                id(canvas_icon_3),id(canvas_icon_4),id(canvas_icon_5)};
          for (int i = 0; i < 16; i++) if (shapes[i]) lv_obj_add_flag(shapes[i], LV_OBJ_FLAG_HIDDEN);
          for (int i = 0; i < 8; i++)  if (texts[i])  lv_obj_add_flag(texts[i], LV_OBJ_FLAG_HIDDEN);
          for (int i = 0; i < 6; i++)  if (icons[i])  lv_obj_add_flag(icons[i], LV_OBJ_FLAG_HIDDEN);

          static const struct { const char *name; const char *glyph; } ICONS[] = {
            {"sun","\U000F0599"}, {"cloud","\U000F0590"}, {"partly-cloudy","\U000F0595"},
            {"rain","\U000F0597"}, {"pouring","\U000F0596"}, {"snow","\U000F0598"},
            {"snow-rain","\U000F067F"}, {"fog","\U000F0591"}, {"hail","\U000F0592"},
            {"lightning","\U000F0593"}, {"storm","\U000F067E"}, {"wind","\U000F059D"},
            {"wind2","\U000F059E"}, {"night","\U000F0594"}, {"alert","\U000F0F2F"},
            {"thermometer","\U000F050F"}, {"humidity","\U000F058E"}, {"fire","\U000F0238"},
            {"minus","\U000F0374"}, {"plus","\U000F0415"},
          };

          // Shared by every element type below AND by the templates further
          // down - one place that claims the next free pool slot and
          // configures it, instead of the rect/text/icon logic duplicated
          // eight more times per template.
          int ns = 0, nt = 0, ni = 0;
          auto put_rect = [&](int x, int y, int w, int h, int r, uint32_t col) {
            if (ns >= 16) return;
            lv_obj_t *o = shapes[ns++];
            if (!o) return;
            lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            lv_obj_align(o, LV_ALIGN_TOP_LEFT, x, y);
            lv_obj_set_size(o, w > 0 ? w : 1, h > 0 ? h : 1);
            lv_obj_set_style_radius(o, r, 0);
            lv_obj_set_style_bg_color(o, lv_color_hex(col), 0);
          };
          auto put_text = [&](int x, int y, int sz, uint32_t col, const std::string &label) {
            if (nt >= 8) return;
            lv_obj_t *o = texts[nt++];
            if (!o) return;
            lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            lv_obj_align(o, LV_ALIGN_TOP_LEFT, x, y);
            const lv_font_t *f = sz >= 2 ? id(font_canvas_lg)->get_lv_font()
                               : sz == 1 ? id(font_canvas_med)->get_lv_font()
                                         : id(font_body)->get_lv_font();
            lv_obj_set_style_text_font(o, f, 0);
            lv_obj_set_style_text_color(o, lv_color_hex(col), 0);
            lv_label_set_text(o, label.c_str());
          };
          // banner is the one template that centres instead of placing at an
          // explicit X - giving the label an explicit width is what makes
          // LV_ALIGN_TOP_MID centre it regardless of string length, instead
          // of the model having to estimate a centred X itself.
          auto put_text_centered = [&](int y, int sz, uint32_t col, const std::string &label) {
            if (nt >= 8) return;
            lv_obj_t *o = texts[nt++];
            if (!o) return;
            lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_width(o, 300);
            lv_obj_set_style_text_align(o, LV_TEXT_ALIGN_CENTER, 0);
            lv_obj_align(o, LV_ALIGN_TOP_MID, 0, y);
            const lv_font_t *f = sz >= 2 ? id(font_canvas_lg)->get_lv_font()
                               : sz == 1 ? id(font_canvas_med)->get_lv_font()
                                         : id(font_body)->get_lv_font();
            lv_obj_set_style_text_font(o, f, 0);
            lv_obj_set_style_text_color(o, lv_color_hex(col), 0);
            lv_label_set_text(o, label.c_str());
          };
          auto put_icon = [&](int x, int y, int sz, uint32_t col, const std::string &name) {
            if (ni >= 6) return;
            lv_obj_t *o = icons[ni++];
            if (!o) return;
            const char *g = "\U000F0F2F";
            for (const auto &e : ICONS) if (name == e.name) { g = e.glyph; break; }
            lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            lv_obj_align(o, LV_ALIGN_TOP_LEFT, x, y);
            lv_obj_set_style_text_font(o, (sz >= 1 ? id(font_canvas_icon_l)
                                                    : id(font_canvas_icon_s))->get_lv_font(), 0);
            lv_obj_set_style_text_color(o, lv_color_hex(col), 0);
            lv_label_set_text(o, g);
          };
          auto put_icon_centered = [&](int y, int sz, uint32_t col, const std::string &name) {
            if (ni >= 6) return;
            lv_obj_t *o = icons[ni++];
            if (!o) return;
            const char *g = "\U000F0F2F";
            for (const auto &e : ICONS) if (name == e.name) { g = e.glyph; break; }
            lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            lv_obj_align(o, LV_ALIGN_TOP_MID, 0, y);
            lv_obj_set_style_text_font(o, (sz >= 1 ? id(font_canvas_icon_l)
                                                    : id(font_canvas_icon_s))->get_lv_font(), 0);
            lv_obj_set_style_text_color(o, lv_color_hex(col), 0);
            lv_label_set_text(o, g);
          };
          // Formats a template's own numbers for display - whole values print
          // without a decimal ("12"), fractional ones keep exactly one ("0.5")
          // - so bar_chart works for both a temperature series and a rainfall
          // one without the model choosing a format itself.
          auto fmt_num = [](double v) -> std::string {
            char buf[16];
            if (v == (double) (int) v) snprintf(buf, sizeof(buf), "%d", (int) v);
            else snprintf(buf, sizeof(buf), "%.1f", v);
            return std::string(buf);
          };
          size_t at = 0;
          while (at <= spec.size()) {
            const size_t bar = spec.find('|', at);
            const std::string item = spec.substr(at, bar == std::string::npos ? std::string::npos : bar - at);
            const size_t next_at = (bar == std::string::npos) ? spec.size() + 1 : bar + 1;

            const size_t c0 = item.find(',');
            if (c0 == std::string::npos) { at = next_at; continue; }
            const std::string type = item.substr(0, c0);
            size_t pos = c0 + 1;

            // Reads one comma-delimited field and advances pos past it.
            auto field = [&]() -> std::string {
              const size_t c = item.find(',', pos);
              const std::string v = item.substr(pos, c == std::string::npos ? std::string::npos : c - pos);
              pos = (c == std::string::npos) ? item.size() : c + 1;
              return v;
            };

            if (type == "rect" && ns < 16) {
              const int x = atoi(field().c_str());
              const int y = atoi(field().c_str());
              const int w = atoi(field().c_str());
              const int h = atoi(field().c_str());
              const int r = atoi(field().c_str());
              const uint32_t col = (uint32_t) strtol(field().c_str(), nullptr, 16);
              lv_obj_t *o = shapes[ns++];
              if (o) {
                lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
                lv_obj_align(o, LV_ALIGN_TOP_LEFT, x, y);
                lv_obj_set_size(o, w > 0 ? w : 1, h > 0 ? h : 1);
                lv_obj_set_style_radius(o, r, 0);
                lv_obj_set_style_bg_color(o, lv_color_hex(col), 0);
              }
            } else if (type == "circle" && ns < 16) {
              const int cx = atoi(field().c_str());
              const int cy = atoi(field().c_str());
              const int r = atoi(field().c_str());
              const uint32_t col = (uint32_t) strtol(field().c_str(), nullptr, 16);
              lv_obj_t *o = shapes[ns++];
              if (o) {
                const int d = r > 0 ? r * 2 : 2;
                lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
                lv_obj_align(o, LV_ALIGN_TOP_LEFT, cx - r, cy - r);
                lv_obj_set_size(o, d, d);
                lv_obj_set_style_radius(o, 999, 0);
                lv_obj_set_style_bg_color(o, lv_color_hex(col), 0);
              }
            } else if (type == "text" && nt < 8) {
              const int x = atoi(field().c_str());
              const int y = atoi(field().c_str());
              const int sz = atoi(field().c_str());
              const uint32_t col = (uint32_t) strtol(field().c_str(), nullptr, 16);
              const std::string label = item.substr(pos);   // rest of the item
              lv_obj_t *o = texts[nt++];
              if (o) {
                lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
                lv_obj_align(o, LV_ALIGN_TOP_LEFT, x, y);
                const lv_font_t *f = sz >= 2 ? id(font_canvas_lg)->get_lv_font()
                                   : sz == 1 ? id(font_canvas_med)->get_lv_font()
                                             : id(font_body)->get_lv_font();
                lv_obj_set_style_text_font(o, f, 0);
                lv_obj_set_style_text_color(o, lv_color_hex(col), 0);
                lv_label_set_text(o, label.c_str());
              }
            } else if (type == "icon" && ni < 6) {
              const int x = atoi(field().c_str());
              const int y = atoi(field().c_str());
              const int sz = atoi(field().c_str());
              const uint32_t col = (uint32_t) strtol(field().c_str(), nullptr, 16);
              const std::string name = item.substr(pos);   // rest of the item
              lv_obj_t *o = icons[ni++];
              if (o) {
                const char *g = "\U000F0F2F";   // alert = fallback for an unknown name
                for (const auto &e : ICONS) if (name == e.name) { g = e.glyph; break; }
                lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
                lv_obj_align(o, LV_ALIGN_TOP_LEFT, x, y);
                lv_obj_set_style_text_font(o, (sz >= 1 ? id(font_canvas_icon_l)
                                                        : id(font_canvas_icon_s))->get_lv_font(), 0);
                lv_obj_set_style_text_color(o, lv_color_hex(col), 0);
                lv_label_set_text(o, g);
              }
            } else if (type == "bar_chart") {
              const std::string title = field();
              const std::string subtitle = field();
              const std::string unit = field();
              const uint32_t col = (uint32_t) strtol(field().c_str(), nullptr, 16);
              const std::string list = item.substr(pos);
              double vals[8]; int n = 0;
              size_t ap = 0;
              while (ap <= list.size() && n < 8) {
                const size_t sc = list.find(';', ap);
                const std::string entry = list.substr(ap, sc == std::string::npos ? std::string::npos : sc - ap);
                ap = (sc == std::string::npos) ? list.size() + 1 : sc + 1;
                if (!entry.empty()) vals[n++] = atof(entry.c_str());
              }
              if (n > 0) {
                double vmin = vals[0], vmax = vals[0];
                for (int i = 1; i < n; i++) {
                  if (vals[i] < vmin) vmin = vals[i];
                  if (vals[i] > vmax) vmax = vals[i];
                }
                int y0 = 12;
                if (!title.empty()) { put_text(14, y0, 1, 0xFFFFFF, title); y0 += 28; }
                if (!subtitle.empty()) put_text(14, y0, 0, 0x8FA6C0, subtitle);
                const int base_y = 210, min_h = 20, max_h = 130;
                const int gap = (320 - 28) / n;
                const int bw = (gap * 0.6) < 34 ? (int) (gap * 0.6) : 34;
                for (int i = 0; i < n; i++) {
                  const double t = (vmax == vmin) ? 0.5 : (vals[i] - vmin) / (vmax - vmin);
                  const int h = min_h + (int) (t * (max_h - min_h));
                  const int bx = 14 + gap * i + (gap - bw) / 2;
                  put_rect(bx, base_y - h, bw, h, 4, col);
                  put_text(bx, base_y - h - 20, 0, 0xFFFFFF, fmt_num(vals[i]) + unit);
                }
              }
            } else if (type == "list") {
              const std::string title = field();
              const std::string list = item.substr(pos);
              int y0 = 12;
              if (!title.empty()) { put_text(14, y0, 1, 0xFFFFFF, title); y0 += 44; }
              size_t ap = 0; int n = 0;
              while (ap <= list.size() && n < 8) {
                const size_t sc = list.find(';', ap);
                const std::string entry = list.substr(ap, sc == std::string::npos ? std::string::npos : sc - ap);
                ap = (sc == std::string::npos) ? list.size() + 1 : sc + 1;
                if (entry.empty()) continue;
                const size_t cp = entry.find(':');
                const std::string icon_name = cp == std::string::npos ? "" : entry.substr(0, cp);
                const std::string label = cp == std::string::npos ? entry : entry.substr(cp + 1);
                const int ry = y0 + n * 34;
                if (!icon_name.empty()) {
                  put_icon(14, ry, 0, 0x8FA6C0, icon_name);
                  put_text(48, ry + 2, 0, 0xFFFFFF, label);
                } else {
                  put_text(14, ry + 2, 0, 0xFFFFFF, label);
                }
                n++;
              }
            } else if (type == "forecast") {
              const std::string title = field();
              const std::string list = item.substr(pos);
              const bool has_title = !title.empty();
              if (has_title) put_text(14, 12, 1, 0xFFFFFF, title);
              std::string entries[4]; int n = 0;
              size_t ap = 0;
              while (ap <= list.size() && n < 4) {
                const size_t sc = list.find(';', ap);
                const std::string entry = list.substr(ap, sc == std::string::npos ? std::string::npos : sc - ap);
                ap = (sc == std::string::npos) ? list.size() + 1 : sc + 1;
                if (!entry.empty()) entries[n++] = entry;
              }
              if (n > 0) {
                const int cw = (320 - 28) / n;
                const int icon_y = has_title ? 44 : 20;
                for (int i = 0; i < n; i++) {
                  const size_t c1 = entries[i].find(':');
                  const size_t c2 = c1 == std::string::npos ? std::string::npos : entries[i].find(':', c1 + 1);
                  const std::string icon_name = c1 == std::string::npos ? entries[i] : entries[i].substr(0, c1);
                  const std::string day = (c1 == std::string::npos || c2 == std::string::npos) ? "" : entries[i].substr(c1 + 1, c2 - c1 - 1);
                  const std::string temp = c2 == std::string::npos ? "" : entries[i].substr(c2 + 1);
                  const int col_x = 14 + cw * i;
                  put_icon(col_x + (cw - 48) / 2, icon_y, 1, 0xE8EEF3, icon_name);
                  // ~8px/char at SIZE 0 (same estimate the spec doc already gives the
                  // model) is close enough to centre a short day/temp label in its column.
                  if (!day.empty()) put_text(col_x + (cw - (int) day.size() * 8) / 2, icon_y + 54, 0, 0x8FA6C0, day);
                  if (!temp.empty()) put_text(col_x + (cw - (int) temp.size() * 8) / 2, icon_y + 76, 0, 0xFFFFFF, temp);
                }
              }
            } else if (type == "gauge") {
              const std::string title = field();
              const std::string list = item.substr(pos);
              int y0 = 12;
              if (!title.empty()) { put_text(14, y0, 1, 0xFFFFFF, title); y0 += 42; }
              size_t ap = 0; int n = 0;
              while (ap <= list.size() && n < 4) {
                const size_t sc = list.find(';', ap);
                const std::string entry = list.substr(ap, sc == std::string::npos ? std::string::npos : sc - ap);
                ap = (sc == std::string::npos) ? list.size() + 1 : sc + 1;
                if (entry.empty()) continue;
                const size_t cp = entry.find(':');
                const std::string label = cp == std::string::npos ? entry : entry.substr(0, cp);
                int pct = cp == std::string::npos ? 0 : atoi(entry.substr(cp + 1).c_str());
                if (pct < 0) pct = 0; if (pct > 100) pct = 100;
                const int ry = y0 + n * 66;
                put_text(14, ry, 0, 0x8FA6C0, label);
                put_rect(14, ry + 20, 200, 18, 9, 0x1A2430);
                put_rect(14, ry + 20, pct * 2, 18, 9, 0xFF8A3D);
                put_text(224, ry + 16, 0, 0xFFFFFF, fmt_num(pct) + "%");
                n++;
              }
            } else if (type == "stat") {
              const std::string icon_name = field();
              const std::string value = field();
              const std::string label = field();
              const std::string sub = item.substr(pos);
              const int text_x = icon_name.empty() ? 40 : 104;
              if (!icon_name.empty()) put_icon(40, 82, 1, 0xFFD24D, icon_name);
              put_text(text_x, 72, 2, 0xFFFFFF, value);
              put_text(icon_name.empty() ? 40 : 90, 142, 0, 0x8FA6C0, label);
              if (!sub.empty()) put_text(icon_name.empty() ? 40 : 60, 166, 0, 0x8FA6C0, sub);
            } else if (type == "status") {
              const std::string title = field();
              const std::string list = item.substr(pos);
              int y0 = 12;
              if (!title.empty()) { put_text(14, y0, 1, 0xFFFFFF, title); y0 += 44; }
              size_t ap = 0; int n = 0;
              while (ap <= list.size() && n < 4) {
                const size_t sc = list.find(';', ap);
                const std::string entry = list.substr(ap, sc == std::string::npos ? std::string::npos : sc - ap);
                ap = (sc == std::string::npos) ? list.size() + 1 : sc + 1;
                if (entry.empty()) continue;
                const size_t c1 = entry.find(':');
                const size_t c2 = c1 == std::string::npos ? std::string::npos : entry.find(':', c1 + 1);
                const std::string label = c1 == std::string::npos ? entry : entry.substr(0, c1);
                const uint32_t col = (c1 == std::string::npos || c2 == std::string::npos) ? 0xFFFFFF
                                      : (uint32_t) strtol(entry.substr(c1 + 1, c2 - c1 - 1).c_str(), nullptr, 16);
                const std::string state = c2 == std::string::npos ? "" : entry.substr(c2 + 1);
                const int ry = y0 + n * 40;
                put_text(14, ry, 0, 0xFFFFFF, label);
                if (!state.empty()) put_text(200, ry, 0, col, state);
                n++;
              }
            } else if (type == "compare") {
              const std::string title = field();
              const std::string name_a = field();
              const std::string name_b = field();
              const std::string list = item.substr(pos);
              if (!title.empty()) put_text(14, 12, 1, 0xFFFFFF, title);
              put_rect(14, 40, 10, 10, 2, 0xFF8A3D);
              put_text(28, 37, 0, 0x8FA6C0, name_a);
              put_rect(90, 40, 10, 10, 2, 0x8FA6C0);
              put_text(104, 37, 0, 0x8FA6C0, name_b);
              std::string labels[4]; double va[4]; double vb[4]; int n = 0;
              size_t ap = 0;
              while (ap <= list.size() && n < 4) {
                const size_t sc = list.find(';', ap);
                const std::string entry = list.substr(ap, sc == std::string::npos ? std::string::npos : sc - ap);
                ap = (sc == std::string::npos) ? list.size() + 1 : sc + 1;
                if (entry.empty()) continue;
                const size_t c1 = entry.find(':');
                const size_t c2 = c1 == std::string::npos ? std::string::npos : entry.find(':', c1 + 1);
                if (c1 == std::string::npos || c2 == std::string::npos) continue;
                labels[n] = entry.substr(0, c1);
                va[n] = atof(entry.substr(c1 + 1, c2 - c1 - 1).c_str());
                vb[n] = atof(entry.substr(c2 + 1).c_str());
                n++;
              }
              if (n > 0) {
                double vmin = va[0], vmax = va[0];
                for (int i = 0; i < n; i++) {
                  if (va[i] < vmin) vmin = va[i]; if (va[i] > vmax) vmax = va[i];
                  if (vb[i] < vmin) vmin = vb[i]; if (vb[i] > vmax) vmax = vb[i];
                }
                const int base_y = 210, min_h = 16, max_h = 100;
                const int gap = (320 - 28) / n;
                for (int i = 0; i < n; i++) {
                  const double ta = (vmax == vmin) ? 0.5 : (va[i] - vmin) / (vmax - vmin);
                  const double tb = (vmax == vmin) ? 0.5 : (vb[i] - vmin) / (vmax - vmin);
                  const int ha = min_h + (int) (ta * (max_h - min_h));
                  const int hb = min_h + (int) (tb * (max_h - min_h));
                  const int bx = 14 + gap * i + (gap - 30) / 2;
                  put_rect(bx, base_y - ha, 14, ha, 3, 0xFF8A3D);
                  put_rect(bx + 16, base_y - hb, 14, hb, 3, 0x8FA6C0);
                  put_text(bx - 4, base_y + 6, 0, 0x8FA6C0, labels[i]);
                }
              }
            } else if (type == "banner") {
              const std::string icon_name = field();
              const std::string message = field();
              const std::string sub = item.substr(pos);
              put_rect(0, 0, 320, 6, 0, 0x6FD08A);
              if (!icon_name.empty()) put_icon_centered(64, 1, 0x6FD08A, icon_name);
              put_text_centered(icon_name.empty() ? 100 : 138, 1, 0xFFFFFF, message);
              if (!sub.empty()) put_text_centered(icon_name.empty() ? 134 : 172, 0, 0x8FA6C0, sub);
            } else if (type == "grid") {
              const std::string title = field();
              const std::string list = item.substr(pos);
              const bool has_title = !title.empty();
              if (has_title) put_text(14, 12, 1, 0xFFFFFF, title);
              const int start_y = has_title ? 52 : 14;
              size_t ap = 0; int n = 0;
              while (ap <= list.size() && n < 4) {
                const size_t sc = list.find(';', ap);
                const std::string entry = list.substr(ap, sc == std::string::npos ? std::string::npos : sc - ap);
                ap = (sc == std::string::npos) ? list.size() + 1 : sc + 1;
                if (entry.empty()) continue;
                const size_t cp = entry.find(':');
                const std::string icon_name = cp == std::string::npos ? "" : entry.substr(0, cp);
                const std::string val = cp == std::string::npos ? entry : entry.substr(cp + 1);
                const int col_i = n % 2, row_i = n / 2;
                const int cx = 14 + col_i * 156, cy = start_y + row_i * 98;
                if (!icon_name.empty()) put_icon(cx, cy, 0, 0x8FA6C0, icon_name);
                put_text(cx + 30, cy + 3, 0, 0xFFFFFF, val);
                n++;
              }
            }
            at = next_at;
          }

          // Only a non-empty spec claims the screen - writing "" clears the
          // drawing without yanking whoever is looking at another page onto
          // a suddenly-blank one. The snapshot is taken only on the
          // transition INTO the drawing, so redrawing while already showing
          // it does not overwrite "what to go back to" with itself.
          if (!spec.empty()) {
            if (!id(canvas_active)) {
              id(canvas_prev_pos) = id(idle_pos);
              id(canvas_prev_idx) = id(idle_page_idx);
              id(canvas_prev_alt) = id(idle_alt);
              id(canvas_active) = true;
            }
            id(idle_pos) = 0;
            id(idle_page_idx) = (int) id(page_canvas)->index;
          }
          // Read by the step below. A global, not a second read of `spec`
          // here, because this runs inside the SAME lambda that already has
          // it - but the step after this one is a separate action and
          // cannot see this lambda's local variables, and unlike the old
          // single-entry-point version there is no one entity left whose
          // state it could re-read instead.
          id(canvas_had_content) = !spec.empty();
      - if:
          condition:
            lambda: return id(canvas_had_content);
          then:
            - script.execute: show_phase_page

  # Tap or swipe while the drawing is on screen: hand the idle screen back to
  # whatever canvas_draw snapshotted, exactly, not just the next carousel
  # stop. No-ops if the drawing is not what is currently claiming the screen.
  - id: canvas_dismiss
    then:
      - lambda: |-
          if (!id(canvas_active)) return;
          id(canvas_active) = false;
          id(idle_pos) = id(canvas_prev_pos);
          id(idle_page_idx) = id(canvas_prev_idx);
          id(idle_alt) = id(canvas_prev_alt);
      - script.execute: show_phase_page

esphome:
  on_boot:
    - priority: 800
      then:
        - logger.log:
            level: INFO
            format: "package: screens/canvas.yaml (\"Draw on screen\" text entity)"
    # Build the shape/text pool once, after LVGL is up - same trick as
    # home-styles.yaml's Dashboard widgets.
    - priority: -190
      then:
        - lambda: |-
            if (id(canvas_ready)) return;
            id(canvas_ready) = true;
            lv_obj_t *p = id(page_canvas)->obj;
            // CLICKABLE cleared on every one of these: lv_obj_create() defaults
            // to clickable, and a tap landing on a drawn shape - which is most
            // of the screen, once something is drawn - would be swallowed
            // right there instead of reaching the dismiss button underneath.
            // Confirmed on hardware 2026-08-01: swipe worked, tap did not,
            // until this was added.
            auto shape = [&](){ lv_obj_t *o = lv_obj_create(p);
              lv_obj_set_style_bg_opa(o, LV_OPA_COVER, 0);
              lv_obj_set_style_border_width(o, 0, 0);
              lv_obj_set_style_pad_all(o, 0, 0);
              lv_obj_clear_flag(o, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); return o; };
            id(canvas_shape_0) = shape();  id(canvas_shape_1) = shape();
            id(canvas_shape_2) = shape();  id(canvas_shape_3) = shape();
            id(canvas_shape_4) = shape();  id(canvas_shape_5) = shape();
            id(canvas_shape_6) = shape();  id(canvas_shape_7) = shape();
            id(canvas_shape_8) = shape();  id(canvas_shape_9) = shape();
            id(canvas_shape_10) = shape(); id(canvas_shape_11) = shape();
            id(canvas_shape_12) = shape(); id(canvas_shape_13) = shape();
            id(canvas_shape_14) = shape(); id(canvas_shape_15) = shape();
            auto txt = [&](){ lv_obj_t *o = lv_label_create(p);
              lv_obj_clear_flag(o, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); return o; };
            id(canvas_text_0) = txt(); id(canvas_text_1) = txt();
            id(canvas_text_2) = txt(); id(canvas_text_3) = txt();
            id(canvas_text_4) = txt(); id(canvas_text_5) = txt();
            id(canvas_text_6) = txt(); id(canvas_text_7) = txt();
            auto ic = [&](){ lv_obj_t *o = lv_label_create(p);
              lv_obj_clear_flag(o, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); return o; };
            id(canvas_icon_0) = ic(); id(canvas_icon_1) = ic();
            id(canvas_icon_2) = ic(); id(canvas_icon_3) = ic();
            id(canvas_icon_4) = ic(); id(canvas_icon_5) = ic();

lvgl:
  pages:
    - id: page_canvas
      skip: true                   # not a carousel stop - only Home Assistant can put you here
      bg_color: ${canvas_bg_color}
      scrollbar_mode: "OFF"
      # Neither direction steps the carousel - both dismiss, same as a tap.
      # A drawing is not a stop on the ring, so "next" or "previous" would
      # not mean anything useful here; what the person wants is just "gone".
      on_swipe_left:
        - script.execute: canvas_dismiss
      on_swipe_right:
        - script.execute: canvas_dismiss
      widgets:
        # Underneath the shapes, so a tap or a swipe anywhere on the drawing
        # reaches this button.
        - button:
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            gesture_bubble: true
            on_click:
              - script.execute: canvas_dismiss
